# Agent OS Standards Index
# Home Assistant Config - S4IT

standards:
  - id: yaml-config
    description: HA YAML configuration conventions
    patterns:
      - Use `!include` to split large configs (automations, templates, scripts, scenes)
      - Use `!include_dir_merge_named` for directory-based includes (themes)
      - Keep `configuration.yaml` as an entrypoint that delegates to includes
      - 2 spaces indentation for all YAML files

  - id: blueprint-pattern
    description: Reusable automation blueprints for repeated patterns
    patterns:
      - Place custom blueprints in `blueprints/automation/custom/`
      - Use blueprints when 3+ automations share the same logic with different parameters
      - Blueprint inputs use HA selectors for UI-friendly configuration
      - Blueprint instances go in `automations.yaml` with `use_blueprint` key

  - id: climate-architecture
    description: Dual fancoil climate control via Versatile Thermostat
    patterns:
      - "New fancoils (stepless): VT valve % → template number → Shelly 0-10V brightness"
      - "Old fancoils (3-speed): VT on_percent → automation → ESP32 Athom 4CH relay (Low/Med/High + valve)"
      - Template numbers in `templates.yaml` bridge VT and Shelly hardware (new fancoils only)
      - Fancoil speed control automation in `automations.yaml` handles ESP32 relay mapping (old fancoils)
      - Seasonal toggle via `input_boolean.heating_season` switches heat/cool
      - Workday sensor (`binary_sensor.workday_sensor`) gates comfort schedules

  - id: esphome-devices
    description: ESPHome device configuration patterns
    patterns:
      - One YAML file per device in `esphome/config/`
      - Shared firmware via remote GitHub package (`packages` key with `url`, `ref`, `file`)
      - Device files contain only name, IP, zone, and package reference
      - Secrets via `!secret` — never hardcoded
      - Fixed IPs on NoT VLAN (10.0.30.0/24)
      - Common includes in `esphome/config/common/` for WiFi and base settings

  - id: entity-naming
    description: Entity naming conventions
    patterns:
      - Climate entities use zone name: `climate.{zone}_climate`
      - Fancoil templates use descriptive names: `Fancoil {Zone} {Number}`
      - Automations use descriptive aliases in YAML

  - id: git-workflow
    description: Version control practices
    patterns:
      - secrets.yaml NEVER committed
      - custom_components/ excluded (HACS-managed)
      - .storage/ excluded (runtime state)
      - Database and log files excluded
      - Deployment is manual pull on Synology NAS
