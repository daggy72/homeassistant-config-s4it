    - sensor.fancoil_*_ema_temperature
    - sensor.fancoil_*_temperature_slope
    - sensor.fancoil_*_power_percent
    - sensor.fancoil_*_valve_open_percent
    - sensor.fancoil_*_on_time
    - sensor.fancoil_*_off_time
    - sensor.fancoil_*_mean_power_cycle
    - sensor.fancoil_*_energy
    - sensor.fancoil_demand_*
    - binary_sensor.climate_mensa_*state
    - binary_sensor.climate_mensa_*bypass
    - binary_sensor.projects_*_safety_state
    - binary_sensor.projects_*_window_bypass
    - binary_sensor.fancoil_*_safety_state
    - binary_sensor.fancoil_*_window_bypass
    - binary_sensor.fancoil_*_presence_state
    - binary_sensor.fancoil_*_motion_state
    - sensor.shellypro4pm_ece334eaf568_switch_*_power
    - sensor.shellypro4pm_ece334eaf568_switch_*_energy
    - switch.shellypro4pm_ece334eaf568_switch_*
