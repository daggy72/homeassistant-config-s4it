boost_zone:
  alias: "Boost Zone (60 min)"
  description: >
    Activate boost preset on a climate entity for 60 minutes.
    Auto-reverts to previous preset when time expires or when
    the boost_auto_revert automation detects target reached.
  fields:
    zone:
      description: "Climate entity to boost"
      example: "climate.fancoil_dagmar"
      selector:
        entity:
          domain: climate
  sequence:
    - action: versatile_thermostat.set_timed_preset
      target:
        entity_id: "{{ zone }}"
      data:
        preset: boost
        duration_minutes: 60

# --- Climate season control, callable from Assist / MCP (2026-09-22) ---
# HassTurnOn can start an exposed script, but it cannot pick an input_select
# option. These three wrappers give the assistant (and voice) a way to switch
# the season without the dashboard. Expose them under Settings > Voice
# assistants > Expose, or they stay dashboard-only.
climate_season_summer:
  alias: "Climate Season Summer"
  description: "Set the office climate season to summer (cooling schedules + chiller active)."
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.climate_season
      data:
        option: summer

climate_season_off:
  alias: "Climate Season Off"
  description: "Set the office climate season to off (all fancoils off, chiller stopped)."
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.climate_season
      data:
        option: "off"

climate_season_winter:
  alias: "Climate Season Winter"
  description: "Set the office climate season to winter (heating schedules)."
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.climate_season
      data:
        option: winter
