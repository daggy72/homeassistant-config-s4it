# --- Dynamic summer cooling setpoint sensors ---
# Calculates ideal comfort cooling temperature based on outdoor temp.
# Avoids cold shock: scales from 24°C (outdoor 25°C) to 27°C (outdoor 33°C+).
- sensor:
    - name: "Summer Comfort Office"
      unique_id: summer_comfort_office
      state: >
        {% set outdoor = states('sensor.outdoor_temperature') | float(25) %}
        {% set target = 24 + (outdoor - 25) / 3 %}
        {{ [24, [target, 27] | min] | max | round(1) }}
      unit_of_measurement: "°C"
      icon: mdi:thermometer-chevron-down
      device_class: temperature
      state_class: measurement

    - name: "Summer Comfort Common"
      unique_id: summer_comfort_common
      state: >
        {% set outdoor = states('sensor.outdoor_temperature') | float(25) %}
        {% set target = 25 + (outdoor - 25) / 3 %}
        {{ [25, [target, 28] | min] | max | round(1) }}
      unit_of_measurement: "°C"
      icon: mdi:thermometer-chevron-down
      device_class: temperature
      state_class: measurement

    - name: "Summer Eco Office"
      unique_id: summer_eco_office
      state: >
        {% set comfort = states('sensor.summer_comfort_office') | float(24) %}
        {{ (comfort + 3) | round(1) }}
      unit_of_measurement: "°C"
      icon: mdi:thermometer-chevron-down
      device_class: temperature
      state_class: measurement

    - name: "Summer Eco Common"
      unique_id: summer_eco_common
      state: >
        {% set comfort = states('sensor.summer_comfort_common') | float(25) %}
        {{ (comfort + 3) | round(1) }}
      unit_of_measurement: "°C"
      icon: mdi:thermometer-chevron-down
      device_class: temperature
      state_class: measurement

    - name: "Meeting Room Temp"
      unique_id: meeting_room_temp
      state: "{{ state_attr('climate.fancoil_meeting', 'current_temperature') }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ state_attr('climate.fancoil_meeting', 'current_temperature') is not none }}

    # --- Trigger-zone room temps (for smart pre-start derivative sensors) ---
    - name: "Fancoil Dagmar Temp"
      unique_id: fancoil_dagmar_temp
      state: "{{ state_attr('climate.fancoil_dagmar', 'current_temperature') }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ state_attr('climate.fancoil_dagmar', 'current_temperature') is not none }}

    - name: "Fancoil Tania Temp"
      unique_id: fancoil_tania_temp
      state: "{{ state_attr('climate.fancoil_tania', 'current_temperature') }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ state_attr('climate.fancoil_tania', 'current_temperature') is not none }}

    - name: "Projects 1 Temp"
      unique_id: projects_1_temp
      state: "{{ state_attr('climate.projects_1', 'current_temperature') }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ state_attr('climate.projects_1', 'current_temperature') is not none }}

    - name: "Fancoil Reception Temp"
      unique_id: fancoil_reception_temp
      state: "{{ state_attr('climate.fancoil_reception', 'current_temperature') }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: >
        {{ state_attr('climate.fancoil_reception', 'current_temperature') is not none }}

    - name: "Mensa Temp"
