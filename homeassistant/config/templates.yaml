        {% if is_state('fan.fancoil_04_fancoil', 'off') %}
          0
        {% else %}
          {{ state_attr('fan.fancoil_04_fancoil', 'percentage') | int(0) }}
        {% endif %}
      set_value:
        # Wider low-speed band for Reception (poor insulation, single fan).
        # Low speed handles most steady-state heating. Medium/high only
        # for large gaps (cold morning preheat).
        - variables:
            spd: >
              {% if value | int <= 0 %}0
              {% elif value | int <= 50 %}33
              {% elif value | int <= 80 %}66
              {% else %}100
              {% endif %}
        - if:
            - condition: template
              value_template: "{{ spd | int > 0 }}"
          then:
            # Staged turn-on: on → wait → low → wait → target speed
            - action: fan.turn_off
              target:
                entity_id: fan.fancoil_04_fancoil
            - delay:
                seconds: 2
            - action: fan.turn_on
              target:
                entity_id: fan.fancoil_04_fancoil
              data:
