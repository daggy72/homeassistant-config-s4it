    # ---------------------------------------------------------------
    # Fancoil VT demand (%) — for dashboard chips / section badges.
    # Reads `power_percent` (0-100) from the Versatile Thermostat climate
    # entity. Note: VT also exposes `on_percent` as the same value scaled 0-1
    # (fraction). Always use `power_percent` here for 0-100 semantics.
    # New-fancoil rooms (Mensa, Dagmar, Projects 1, Projects 2) already
    # expose demand via `number.fancoil_<room>` template numbers above —
    # bind those directly. The six sensors below cover the OLD ESP32-
    # relay fancoil rooms that don't have a number entity.
    # ---------------------------------------------------------------
    - name: "Fancoil OpenSpace Demand"
