# Template number entities — map Versatile Thermostat valve % to Shelly 0-10V fan speed
# VT (over_valve mode) sends 0-100% → template number → light brightness → 0-10V output
- number:
    # Mensa: one Shelly 0-10V (Shelly "Fancoils-Mensa", MAC 8813bfe0fc18) drives
    # both ceiling fancoils wired electrically in parallel.
    - name: "Fancoil Mensa"
      unique_id: fancoil_mensa_1
      min: 0
      max: 100
      step: 1
      unit_of_measurement: "%"
      state: >
        {% if is_state('light.shellypro0110pm_8813bfe0fc18', 'on') %}
          {{ (state_attr('light.shellypro0110pm_8813bfe0fc18', 'brightness') | float(0) / 255 * 100) | round(0) }}
        {% else %}
          0
        {% endif %}
      set_value:
        # MAINTAIN BAND (2026-06-22, ceiling made time-aware 2026-06-25): while
        # cooling in comfort/eco, hold the analog valve in a quiet band: floor 15%
        # (never 0 = no cycling). Ceiling is 70% during the occupied day (08:00-18:00,
        # below the 100% scream) but 100% outside it — so the 06:00 heatwave pre-cool
        # (comfort/eco) can run flat-out before staff arrive. boost/boil/off always
        # pass through (100% ok). Over-cool-safe: the chiller is demand-driven.
        - variables:
            out: >
              {% set v = value | int %}
              {% set hi = 70 if today_at('08:00') <= now() < today_at('18:00') else 100 %}
              {% if is_state('climate.climate_mensa','cool') and state_attr('climate.climate_mensa','preset_mode') in ['comfort','eco'] %}
                {{ [[v, 15] | max, hi] | min if v > 0 else 15 }}
              {% else %}
                {{ v }}
              {% endif %}
        - if:
            - condition: template
              value_template: "{{ out | int > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: light.shellypro0110pm_8813bfe0fc18
              data:
                brightness_pct: "{{ out | int }}"
          else:
            - action: light.turn_off
              target:
                entity_id: light.shellypro0110pm_8813bfe0fc18

