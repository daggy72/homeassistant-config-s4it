    # --- Old fancoil template numbers (ESP32 3-speed relay control) ---
    # VT (over_valve mode) sends 0-100% → template number → ESP32 fan speed
    # When old fancoils are replaced with stepless units, just change set_value
    # to control Shelly 0-10V brightness instead of ESP32 fan relays.

    # Dagmar's office: one Shelly 0-10V (Shelly "Fancoils-Dagmar", MAC 8813bfd9525c)
    # drives both new stepless fancoils wired electrically in parallel. Replaces the
    # old binary smart-plug fancoil.
    - name: "Fancoil Dagmar"
      unique_id: fancoil_dagmar
      min: 0
      max: 100
      step: 1
      unit_of_measurement: "%"
      state: >
        {% if is_state('light.shellypro0110pm_8813bfd9525c', 'on') %}
          {{ (state_attr('light.shellypro0110pm_8813bfd9525c', 'brightness') | float(0) / 255 * 100) | round(0) }}
        {% else %}
          0
        {% endif %}
      set_value:
        - if:
            - condition: template
              value_template: "{{ value | int > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: light.shellypro0110pm_8813bfd9525c
              data:
                brightness_pct: "{{ value | int }}"
          else:
            - action: light.turn_off
              target:
                entity_id: light.shellypro0110pm_8813bfd9525c

    - name: "Fancoil Tania"
      unique_id: fancoil_tania_valve
      min: 0
      max: 100
      step: 1
      unit_of_measurement: "%"
      state: >
        {% set a = state_attr('fan.fancoil_09_fancoil', 'percentage') | int(0) %}
        {% set b = state_attr('fan.fancoil_10_fancoil', 'percentage') | int(0) %}
        {% if is_state('fan.fancoil_09_fancoil', 'off') %}{% set a = 0 %}{% endif %}
        {% if is_state('fan.fancoil_10_fancoil', 'off') %}{% set b = 0 %}{% endif %}
        {{ ((a + b) / 2) | round(0) }}
      set_value:
        - variables:
            step: >
              {% if value | int <= 0 %}0
              {% elif value | int <= 17 %}1
              {% elif value | int <= 33 %}2
              {% elif value | int <= 50 %}3
              {% elif value | int <= 67 %}4
              {% elif value | int <= 83 %}5
              {% else %}6
              {% endif %}
            spd_a: "{{ [0, 33, 33, 66, 66, 100, 100][step | int] }}"
            spd_b: "{{ [0, 0, 33, 33, 66, 66, 100][step | int] }}"
        # Staged turn-on: on at low → wait 2s → target speed
        - if:
            - condition: template
              value_template: "{{ spd_a | int > 0 }}"
          then:
            - action: fan.turn_off
              target:
                entity_id: fan.fancoil_09_fancoil
            - delay:
                seconds: 2
            - action: fan.turn_on
              target:
                entity_id: fan.fancoil_09_fancoil
              data:
                percentage: 33
            - delay:
                seconds: 2
            - action: fan.turn_on
              target:
                entity_id: fan.fancoil_09_fancoil
              data:
                percentage: "{{ spd_a }}"
          else:
            - action: fan.turn_off
              target:
                entity_id: fan.fancoil_09_fancoil
        - if:
            - condition: template
              value_template: "{{ spd_b | int > 0 }}"
          then:
            - action: fan.turn_off
              target:
                entity_id: fan.fancoil_10_fancoil
            - delay:
