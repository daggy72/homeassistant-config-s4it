      icon: mdi:fan
      state_class: measurement
      state: >
        {% if states('climate.fancoil_tania') in ['off', 'unavailable', 'unknown', 'none'] %}
          0
        {% else %}
          {{ (state_attr('climate.fancoil_tania', 'power_percent') | float(0)) | round(0) }}
        {% endif %}
      availability: >
        {{ states('climate.fancoil_tania') not in ['unavailable', 'unknown', 'none'] }}

    - name: "Fancoil Reception Demand"
      unique_id: fancoil_reception_demand
      unit_of_measurement: "%"
      icon: mdi:fan
      state_class: measurement
      state: >
        {% if states('climate.fancoil_reception') in ['off', 'unavailable', 'unknown', 'none'] %}
          0
        {% else %}
          {{ (state_attr('climate.fancoil_reception', 'power_percent') | float(0)) | round(0) }}
        {% endif %}
      availability: >
        {{ states('climate.fancoil_reception') not in ['unavailable', 'unknown', 'none'] }}

    - name: "Fancoil Entrance Demand"
      unique_id: fancoil_entrance_demand
      unit_of_measurement: "%"
      icon: mdi:fan
      state_class: measurement
      state: >
        {% if states('climate.fancoil_entrance') in ['off', 'unavailable', 'unknown', 'none'] %}
          0
        {% else %}
          {{ (state_attr('climate.fancoil_entrance', 'power_percent') | float(0)) | round(0) }}
        {% endif %}
      availability: >
        {{ states('climate.fancoil_entrance') not in ['unavailable', 'unknown', 'none'] }}

# --- Trigger-based forecast sensor (refreshes every 30 min + HA start) ---
# Calls weather.get_forecasts service and exposes today's forecast high.
# Used by smart_climate_prestart to detect "hot day expected" mornings.
- trigger:
    - platform: time_pattern
      minutes: '/30'
    - platform: homeassistant
      event: start
  action:
    - delay:
        seconds: 5
    - service: weather.get_forecasts
      data:
        type: daily
      target:
        entity_id: weather.forecast_home
      response_variable: fcast
  sensor:
    - name: "Outdoor Forecast Max Today"
      unique_id: outdoor_forecast_max_today
      state: "{{ fcast['weather.forecast_home'].forecast[0].temperature }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:weather-sunny-alert
