      availability: >
        {{ state_attr('climate.fancoil_cs', 'current_temperature') is not none }}

    - name: "Outdoor Cloud Coverage"
      unique_id: outdoor_cloud_coverage
      state: "{{ state_attr('weather.forecast_home', 'cloud_coverage') }}"
      unit_of_measurement: "%"
      icon: mdi:cloud-percent-outline
      state_class: measurement
      availability: >
        {{ state_attr('weather.forecast_home', 'cloud_coverage') is not none }}

    # ---------------------------------------------------------------
    # Fancoil VT demand (%) — for dashboard chips / section badges.
    # Reads `power_percent` (0-100) from the Versatile Thermostat climate
    # entity. Note: VT also exposes `on_percent` as the same value scaled 0-1
    # (fraction). Always use `power_percent` here for 0-100 semantics.
    # New-fancoil rooms (Mensa, Dagmar, Projects 1, Projects 2) already
    # expose demand via `number.fancoil_<room>` template numbers above —
    # bind those directly. The six sensors below cover the OLD ESP32-
    # relay fancoil rooms that don't have a number entity.
    # ---------------------------------------------------------------
    - name: "Fancoil OpenSpace Demand"
      unique_id: fancoil_openspace_demand
      unit_of_measurement: "%"
      icon: mdi:fan
      state_class: measurement
      state: >
        {% if states('climate.fancoil_openspace') in ['off', 'unavailable', 'unknown', 'none'] %}
          0
        {% else %}
          {{ (state_attr('climate.fancoil_openspace', 'power_percent') | float(0)) | round(0) }}
        {% endif %}
      availability: >
        {{ states('climate.fancoil_openspace') not in ['unavailable', 'unknown', 'none'] }}

    - name: "Fancoil CS Demand"
      unique_id: fancoil_cs_demand
      unit_of_measurement: "%"
