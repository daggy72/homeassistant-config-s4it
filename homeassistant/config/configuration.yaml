# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: storage
  dashboards:
    climate-control:
      mode: yaml
      title: Climate Control
      icon: mdi:thermostat
      show_in_sidebar: true
      filename: dashboards/climate.yaml

logger:
  default: info
  logs:
    custom_components.nector200: debug

influxdb: !include influxdb.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
   - 10.0.10.10      # IP address of the proxy server
   - 127.0.0.1      # localhost (proxy and HA run on same host)
   - 172.16.0.0/12   # Docker bridge networks (Cloudflare Tunnel)

auth_oidc:
  client_id: homeassistant
  discovery_url: "https://keycloak.sales4.it/realms/sales4/.well-known/openid-configuration"
  display_name: "Sales4 SSO"
  groups_scope: homeassistant-roles
  roles:
    user: homeassistant-user
    admin: homeassistant-admin
  features:
    default_redirect: false
    force_https: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# --- Seasonal Climate Mode ---
# NOTE: no `initial:` set — HA restores the last-saved value of climate_season
# across restarts from .storage/core.restore_state. Setting `initial:` here
# forces the value on every restart and broke things on 2026-05-25 (HA update
# reset summer → winter overnight, skipped Monday morning chiller pre-start).
input_select:
  climate_season:
    name: "Climate Season"
    icon: mdi:sun-snowflake-variant
    options:
      - winter
      - "off"
      - summer

# --- Template entities (fancoil number → Shelly 0-10V brightness) ---
template: !include templates.yaml

# --- Sun shade helpers (see docs/superpowers/specs/2026-04-07-intelligent-sun-shade-design.md) ---
input_number: !include input_numbers.yaml
input_boolean: !include input_booleans.yaml
input_text: !include input_texts.yaml
input_datetime: !include input_datetimes.yaml
timer: !include timers.yaml
counter: !include counters.yaml
sensor: !include sensors.yaml

# --- Telegram (watchdog phone alerts, see automations.yaml watchdog_* ids) ---
# HA 2026.7.1: telegram_bot no longer supports YAML setup (config-entry/UI
# only — Settings > Devices & Services > Add Integration > Telegram Bot).
# No YAML block here; see hosting.md for the setup + entity-id lookup steps.
