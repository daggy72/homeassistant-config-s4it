# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

logger:
  default: info
  logs:
    custom_components.nector200: debug

http:
  use_x_forwarded_for: true
  trusted_proxies:
   - 10.0.10.10      # IP address of the proxy server
   - 127.0.0.1      # localhost (proxy and HA run on same host)
   - 172.16.0.0/12   # Docker bridge networks (Cloudflare Tunnel)
   
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# --- Seasonal Climate Mode ---
# NOTE: no `initial:` set — HA restores the last-saved value of climate_season
# across restarts from .storage/core.restore_state. Setting `initial:` here
# forces the value on every restart and broke things on 2026-05-25 (HA update
# reset summer → winter overnight, skipped Monday morning chiller pre-start).
input_select:
  climate_season:
    name: "Climate Season"
    icon: mdi:sun-snowflake-variant
    options:
      - winter
      - "off"
      - summer

# --- Template entities (fancoil number → Shelly 0-10V brightness) ---
template: !include templates.yaml

# --- Sun shade helpers (see docs/superpowers/specs/2026-04-07-intelligent-sun-shade-design.md) ---
input_number: !include input_numbers.yaml
input_datetime: !include input_datetimes.yaml
timer: !include timers.yaml
counter: !include counters.yaml
sensor: !include sensors.yaml

# --- Panel iframes ---
panel_iframe:
  esphome:
    title: "ESPHome"
    url: "https://esphome.sales4.it"
    icon: mdi:chip
    require_admin: true

