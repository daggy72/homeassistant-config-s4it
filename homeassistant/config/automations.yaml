- id: '1770681600001'
  alias: Seasonal Climate Mode Switch
  description: >
    Switch all VT fancoil entities between heat/cool/off based on the
    climate_season selector. Controls chiller (respecting the 10-min
    min-cycle rule on transitions). Forces comfort preset after mode
    change to prevent the 0 °C frost bug (unconfigured cool-mode presets).
    NOTE: chiller cold-water delivery to fancoils takes ~10-15 min (measured
    2026-05-24). On weekday mornings the separate "Chiller Pre-start"
    automation fires first so cold water is already flowing by the time
    a user-initiated summer switch happens; if no pre-start, expect
    ~15 min of warm-air blowing before useful cooling begins.
  triggers:
  - trigger: state
    entity_id: input_select.climate_season
  conditions: []
  actions:
  - variables:
      # Projects 2 REMOVED 2026-06-09 — unoccupied, kept dormant (off).
      # See common_climate_schedule note. Re-add when reoccupied.
      all_thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_cs
      - climate.fancoil_reception
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      - climate.projects_2
      new_season: "{{ states('input_select.climate_season') }}"
      chiller_last_changed_age: >
        {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() }}
      chiller_min_cycle_ok: >
        {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ all_thermostats }}"
    data:
      hvac_mode: "off"
  - delay:
      seconds: 5
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ new_season == 'winter' }}"
      sequence:
      # Heating doesn't use the chiller — turn it off if it has been on long enough
      - if:
        - condition: template
          value_template: >
            {{ is_state('switch.shellypro4pm_ece334eaf568_switch_2', 'on') and chiller_min_cycle_ok }}
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.shellypro4pm_ece334eaf568_switch_2
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          hvac_mode: heat
      # Force comfort preset so VTs land on a sane setpoint
      - action: climate.set_preset_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          preset_mode: comfort
    - conditions:
      - condition: template
        value_template: "{{ new_season == 'summer' }}"
      sequence:
      # Cooling needs the chiller — turn it on if it has been off long enough
      - if:
        - condition: template
          value_template: >
            {{ is_state('switch.shellypro4pm_ece334eaf568_switch_2', 'off') and chiller_min_cycle_ok }}
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.shellypro4pm_ece334eaf568_switch_2
      - delay:
          seconds: 5
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          hvac_mode: cool
      # Force comfort preset so VTs don't land on boost/frost with 0 °C target
      # (Summer Dynamic Temperature Adjustment then keeps comfort temp tuned)
      - action: climate.set_preset_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          preset_mode: comfort
    - conditions:
      - condition: template
        value_template: "{{ new_season == 'off' }}"
      sequence:
      # Season=off: ensure chiller is off (respecting min-cycle)
      - if:
        - condition: template
          value_template: >
            {{ is_state('switch.shellypro4pm_ece334eaf568_switch_2', 'on') and chiller_min_cycle_ok }}
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single
- id: chiller_pre_start
  alias: Chiller Pre-start (workday morning) [DEPRECATED]
  initial_state: false
  description: >
    DEPRECATED 2026-06-08 — superseded by `smart_climate_prestart` which
    decides activation based on actual room temps, rate of rise, and
    weather forecast rather than firing unconditionally at 06:30.

    On workday mornings during summer mode, turn the chiller ON early
    enough for cold water to reach all fancoils before the schedule
    blueprints engage cooling at 07:30 (preheat/precool) and 08:00 (comfort).
    Measured chiller→useful-cooling delay is ~10-15 min on a mild morning
    (2026-05-24), so 06:30 leaves comfortable margin. Respects the 10-min
    min-cycle guard: skips if chiller has transitioned in the last 10 min.
  triggers:
  - trigger: time
    at: '06:30:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'off'
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single

- id: smart_climate_prestart
  alias: Smart Climate Pre-start [DEPRECATED 2026-06-20]
  initial_state: false
  description: >
    DEPRECATED 2026-06-20 — superseded by the demand-driven chiller
    (chiller_on_demand / chiller_idle_off_no_demand) plus
    chiller_prestart_forecast. VT cool-mode activation is handled by
    morning_vt_alignment + the seasonal switch. Kept disabled for reference.

    Decides whether to engage chiller + fancoils based on real-time
    conditions rather than firing unconditionally at 06:30. Runs as a
    10-min tick + instantly on relevant sensor crossings, between 05:30
    and 19:30 workday during summer mode.

    Trigger zones (drive activation):
      - Always occupied: Dagmar, Tania, Reception, Projects 1
      - Conditional: CS, Meeting (only count if preset=comfort OR motion=on)
    Non-trigger zones (carried along once activation happens but don't
    drive the decision): OpenSpace, Entrance, Mensa.
    Projects 2 stays off (unoccupied).

    Activates if ANY of:
      A. Any always-occupied zone temp >= 25.0 °C
      B. Any conditional zone temp >= 25.0 °C AND zone is occupied
      C. Any trigger-zone temp rate >= 1.5 °C/h (sun-on-window catch)
      D. Outdoor now >= 22 °C AND forecast max today >= 28 °C AND time
         before 09:00 (preemptive heatwave morning)

    Activation sequence:
      1. Chiller ON
      2. Wait 10 min for chilled water to reach fancoils
      3. Staggered VT cool-mode activation (30s between zones) to ramp
         chiller load gradually instead of 10 simultaneous demands.

    Tune thresholds via inline values below; nothing here is exposed as
    input_number yet — easy to refactor later if needed.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: '/10'
    id: tick
  - trigger: numeric_state
    entity_id:
    - sensor.fancoil_dagmar_temp
    - sensor.fancoil_tania_temp
    - sensor.projects_1_temp
    - sensor.fancoil_reception_temp
    - sensor.cs_temp
    - sensor.meeting_room_temp
    above: 25.0
    id: warm_room
  - trigger: numeric_state
    entity_id:
    - sensor.fancoil_dagmar_temp_rate
    - sensor.fancoil_tania_temp_rate
    - sensor.projects_1_temp_rate
    - sensor.fancoil_reception_temp_rate
    - sensor.cs_temp_rate
    - sensor.meeting_room_temp_rate
    above: 1.5
    id: fast_rise
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'off'
  # No new chiller pre-start after 17:00 — offices move to frost (no cooling)
  # at 17:30, so starting the chiller in the evening just wastes energy.
  - condition: time
    after: '05:30:00'
    before: '17:00:00'
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  - condition: template
    value_template: >
      {% set warm_th = 25.0 %}
      {% set rate_th = 1.5 %}
      {% set outdoor_pre = 22.0 %}
      {% set forecast_pre = 28.0 %}

      {% set always_temps = [
        states('sensor.fancoil_dagmar_temp') | float(0),
        states('sensor.fancoil_tania_temp') | float(0),
        states('sensor.projects_1_temp') | float(0),
        states('sensor.fancoil_reception_temp') | float(0)
      ] %}
      {% set always_rates = [
        states('sensor.fancoil_dagmar_temp_rate') | float(0),
        states('sensor.fancoil_tania_temp_rate') | float(0),
        states('sensor.projects_1_temp_rate') | float(0),
        states('sensor.fancoil_reception_temp_rate') | float(0)
      ] %}

      {# Conditional zone occupancy: preset=comfort OR motion=on #}
      {% set cs_occ = state_attr('climate.fancoil_cs', 'preset_mode') == 'comfort'
        or is_state('binary_sensor.cc_up_sense_motion', 'on') %}
      {% set m_occ = state_attr('climate.fancoil_meeting', 'preset_mode') == 'comfort'
        or is_state('binary_sensor.mt_meeting_room_up_sense_motion', 'on') %}
      {% set cs_temp = states('sensor.cs_temp') | float(0) %}
      {% set m_temp = states('sensor.meeting_room_temp') | float(0) %}
      {% set cs_rate = states('sensor.cs_temp_rate') | float(0) %}
      {% set m_rate = states('sensor.meeting_room_temp_rate') | float(0) %}

      {% set a = always_temps | select('ge', warm_th) | list | length > 0 %}
      {% set b = (cs_occ and cs_temp >= warm_th) or (m_occ and m_temp >= warm_th) %}
      {% set c = (always_rates | select('ge', rate_th) | list | length > 0)
        or (cs_occ and cs_rate >= rate_th)
        or (m_occ and m_rate >= rate_th) %}
      {% set d = now().hour < 9
        and states('sensor.outdoor_temperature') | float(0) >= outdoor_pre
        and states('sensor.outdoor_forecast_max_today') | float(0) >= forecast_pre %}

      {{ a or b or c or d }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  - delay:
      minutes: 10
  - repeat:
      for_each:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_reception
      - climate.fancoil_cs
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) != 'cool' }}"
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: "{{ repeat.item }}"
          data:
            hvac_mode: cool
      - delay:
          seconds: 30

# p2_dormant_off_guard REMOVED 2026-06-20 — Projects 2 is re-staffed and now
# on the eco-default schedule (cs_climate_schedule) with valid presets, so it
# no longer needs to be force-held off.

- id: morning_vt_alignment
  alias: Morning VT Alignment (workday)
  description: >
    Each workday at 07:00, ensure every VT's hvac_mode matches the
    current season selector and every VT is in `comfort` preset.
    Recovers from manual VT-off overrides done the previous evening,
    weekend HA restarts, or any other condition that left VTs out of
    sync with input_select.climate_season. Does NOT touch the chiller
    (handled separately by Chiller Pre-start, which fires at 06:30).
    Skips entirely on non-workdays.
  triggers:
  - trigger: time
    at: '07:00:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - variables:
      # Projects 2 REMOVED 2026-06-09 — unoccupied, kept dormant (off).
      # See common_climate_schedule note. Re-add when reoccupied.
      all_thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_cs
      - climate.fancoil_reception
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      - climate.projects_2
      season: "{{ states('input_select.climate_season') }}"
      target_hvac: >
        {% if season == 'summer' %}cool
        {% elif season == 'winter' %}heat
        {% else %}off
        {% endif %}
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ all_thermostats }}"
    data:
      hvac_mode: "{{ target_hvac | trim }}"
  # Only set comfort preset when actively heating/cooling — keeps weekend off-state clean
  - if:
    - condition: template
      value_template: "{{ target_hvac | trim != 'off' }}"
    then:
    - action: climate.set_preset_mode
      target:
        entity_id: "{{ all_thermostats }}"
      data:
        preset_mode: comfort
  mode: single
- id: ha_startup_climate_restore
  alias: HA Startup — Climate Restore
  description: >
    On Home Assistant startup, re-apply the climate_season's hvac_mode to all
    VTs. Defends against HA restarts mid-season where VTs might come back in
    an off state. Does NOT touch preset_mode — leaves restored preset alone
    (correct for time-of-day since the schedule blueprints had already set
    eco/frost/comfort before the restart).

    Does NOT touch the chiller — that's managed by Chiller Pre-start (morning)
    and Chiller End-of-day Off (evening).

    History:
    - 2026-05-26 T22 fix #1: switched trigger from `homeassistant`/`event: start`
      to `event`/`event_type: homeassistant_started` (waits for all integrations
      to finish setup). Still misses sometimes due to registration-vs-event race.
    - 2026-05-26 T22 fix #2 (this version): REMOVED the unconditional preset-
      force to `comfort`. Original purpose was killing the 0 °C frost bug, but
      T5 (per-VT cool-mode presets configured) made that defense obsolete.
      Forcing comfort at evening restarts caused over-cooling at 21:30 (target
      25 °C in a 30 °C room → max demand).
  triggers:
  - trigger: event
    event_type: homeassistant_started
  conditions: []
  actions:
  # Short additional delay for VT's per-entity async init to settle after
  # the homeassistant_started event.
  - delay:
      seconds: 30
  - variables:
      # Projects 2 REMOVED 2026-06-09 — unoccupied, kept dormant (off).
      # See common_climate_schedule note. Re-add when reoccupied.
      all_thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_cs
      - climate.fancoil_reception
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      - climate.projects_2
      season: "{{ states('input_select.climate_season') }}"
      target_hvac: >
        {% if season == 'summer' %}cool
        {% elif season == 'winter' %}heat
        {% else %}off
        {% endif %}
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ all_thermostats }}"
    data:
      hvac_mode: "{{ target_hvac | trim }}"
  # NOTE: intentionally NOT touching preset_mode. Restored preset from
  # restore_state is correct for current time-of-day (schedule blueprints
  # had set eco/frost/comfort before the restart). Forcing comfort here
  # caused over-cooling at evening restarts (2026-05-26 21:24 incident).
  mode: single
# 2026-06-20: chiller_end_of_day_off (18:00 hard-off) and
# chiller_safety_off_weekend REMOVED. They blocked the demand-driven model and
# weekend boil protection. The chiller now follows real cooling demand 7 days a
# week (chiller_on_demand on / chiller_idle_off_no_demand off), so it switches
# off on its own when nothing needs cooling and stays available when a room
# overheats — including after 18:00 and on weekends.

- id: chiller_on_demand
  alias: Chiller On — cooling demand (fancoil interlock)
  description: >
    2026-06-20 interlock fix: the chiller must be ON whenever ANY VT is actually
    cooling, so fancoils never blow warm air over an uncooled coil (the Saturday
    waste bug). Runs 7 days/week incl. weekends for boil protection. Turns the
    chiller on when a zone demands cooling and the chiller is off. Respects the
    10-min min-cycle. The OFF side is chiller_idle_off_no_demand.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: '/3'
  - trigger: state
    entity_id:
    - climate.fancoil_dagmar
    - climate.fancoil_tania
    - climate.projects_1
    - climate.fancoil_cs
    - climate.fancoil_reception
    - climate.fancoil_meeting
    - climate.fancoil_openspace
    - climate.fancoil_entrance
    - climate.climate_mensa
    - climate.projects_2
    attribute: hvac_action
    to: cooling
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'off'
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  - condition: template
    value_template: >
      {% set zones = [
        'climate.fancoil_dagmar','climate.fancoil_tania','climate.projects_1',
        'climate.fancoil_cs','climate.fancoil_reception','climate.fancoil_meeting',
        'climate.fancoil_openspace','climate.fancoil_entrance','climate.climate_mensa',
        'climate.projects_2'] %}
      {{ zones | map('state_attr','hvac_action') | select('eq','cooling') | list | length > 0 }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single

- id: chiller_prestart_forecast
  alias: Chiller Pre-start — warm-forecast morning
  description: >
    2026-06-20: on warm-forecast mornings (7 days), start the chiller at 07:30
    so cold water is ready before rooms heat / before 08:00 comfort. Only if
    today's forecast max >= 27 C, season summer, chiller off, min-cycle ok. If
    no real demand follows, chiller_idle_off_no_demand turns it back off.
  mode: single
  triggers:
  - trigger: time
    at: '07:30:00'
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.outdoor_forecast_max_today
    above: 27
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single

- id: chiller_idle_off_no_demand
  alias: Chiller Idle Off — no cooling demand (sustained 30 min)
  description: >
    OFF side of the demand-driven chiller (with chiller_on_demand). Turns the
    chiller off only after NO VT has been cooling for a SUSTAINED 30 minutes —
    not on a brief lull. This avoids the failure mode where an eager idle-off
    drops the chiller during a short gap, then demand returns inside the 10-min
    min-cycle lockout, leaving fancoils blowing warm air (observed 2026-06-20).
    On hot days with continuous demand it simply never fires. Respects the
    10-min min-cycle. Runs 7 days/week.
  mode: single
  triggers:
  - trigger: template
    value_template: >
      {% set zones = [
        'climate.fancoil_dagmar','climate.fancoil_tania','climate.projects_1',
        'climate.fancoil_cs','climate.fancoil_reception','climate.fancoil_meeting',
        'climate.fancoil_openspace','climate.fancoil_entrance','climate.climate_mensa',
        'climate.projects_2'] %}
      {{ zones | map('state_attr','hvac_action') | select('eq','cooling') | list | length == 0 }}
    for: '00:30:00'
  conditions:
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'on'
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single

- id: offhours_boil_enforcer
  alias: Off-hours / Weekend Boil Protection Enforcer
  description: >
    Makes boil protection actually run. During summer, on non-workdays OR
    outside office hours (18:00–08:00), every VT must sit in COOL mode at the
    BOIL target (office 30 / common 31) so it idles until a room exceeds it,
    then cools it back down (demand-driven chiller follows). Runs every 10 min
    + on HA start + at 18:00.

    2026-06-21 fix: the VTs have NO selectable 'frost' preset (preset_modes =
    none/eco/comfort/boost), so set_preset_mode('frost') errored and nothing
    applied. Boil is now done as preset 'none' + set_temperature to the boil
    target. This also clears any stale 0 °C target (e.g. Projects 2).
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: '/10'
  - trigger: homeassistant
    event: start
  - trigger: time
    at: '18:00:00'
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: 'off'
    - condition: time
      after: '18:00:00'
      before: '08:00:00'
  actions:
  - variables:
      # boil target per zone: offices 30, common (OpenSpace/Entrance) 31
      boil_map:
        climate.fancoil_dagmar: 30
        climate.fancoil_tania: 30
        climate.projects_1: 30
        climate.fancoil_reception: 30
        climate.fancoil_cs: 30
        climate.fancoil_meeting: 30
        climate.climate_mensa: 30
        climate.projects_2: 30
        climate.fancoil_openspace: 31
        climate.fancoil_entrance: 31
  - repeat:
      for_each: "{{ boil_map.keys() | list }}"
      sequence:
      - variables:
          z: "{{ repeat.item }}"
          boil: "{{ boil_map[repeat.item] | float }}"
      - if:
        - condition: template
          value_template: "{{ states(z) not in ['cool','unavailable','unknown'] }}"
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: "{{ z }}"
          data:
            hvac_mode: cool
      - if:
        - condition: template
          value_template: "{{ state_attr(z,'preset_mode') != 'none' }}"
        then:
        - action: climate.set_preset_mode
          target:
            entity_id: "{{ z }}"
          data:
            preset_mode: none
      - if:
        - condition: template
          value_template: "{{ (state_attr(z,'temperature') | float(0)) != boil }}"
        then:
        - action: climate.set_temperature
          target:
            entity_id: "{{ z }}"
          data:
            temperature: "{{ boil }}"

- id: warehouse_cell_profile_guard
  alias: Warehouse Cell Profile Guard
  description: >
    Applies NECTOR cooling/heating guard profiles from operator min/max helpers.
    Keeps cooling as the default passive stock-protection profile and enables
    heating only below the low guard. Manual hold prevents writes. Reapplies the
    last requested profile after Home Assistant restart because the integration
    diagnostic profile state is memory-only.
  triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: state
      entity_id:
        - input_number.warehouse_cell_min_temperature
        - input_number.warehouse_cell_max_temperature
      id: limit_change
    - trigger: state
      entity_id: sensor.wh1_temperature
      id: temperature_change
    - trigger: state
      entity_id: input_boolean.warehouse_cell_manual_hold
      to: "off"
      id: manual_hold_released
    - trigger: time_pattern
      minutes: "/15"
      id: periodic
  conditions:
    - condition: state
      entity_id: input_boolean.warehouse_cell_manual_hold
      state: "off"
    - condition: template
      value_template: >
        {% set min_temp = states('input_number.warehouse_cell_min_temperature') | float(none) %}
        {% set max_temp = states('input_number.warehouse_cell_max_temperature') | float(none) %}
        {% set current_temp = states('sensor.wh1_temperature') | float(none) %}
        {{ min_temp is not none and max_temp is not none and current_temp is not none and min_temp < max_temp and (max_temp - min_temp) >= 2.0 }}
  actions:
    - variables:
        min_temp: "{{ states('input_number.warehouse_cell_min_temperature') | float(none) }}"
        max_temp: "{{ states('input_number.warehouse_cell_max_temperature') | float(none) }}"
        current_temp: "{{ states('sensor.wh1_temperature') | float(none) }}"
        active_profile: "{{ states('sensor.wh1_last_applied_profile') | trim }}"
        needs_profile_reapply: "{{ active_profile not in ['heating_guard', 'cooling_guard'] }}"
        last_requested_profile: "{{ states('input_text.warehouse_cell_last_requested_profile') | trim }}"
        last_requested_command: "{{ states('input_text.warehouse_cell_last_requested_command') | trim }}"
        effective_profile: >
          {%- if active_profile in ['heating_guard', 'cooling_guard'] -%}
            {{ active_profile }}
          {%- else -%}
            {{ last_requested_profile }}
          {%- endif -%}
        target_profile: >
          {%- set heat_enter = min_temp + 0.3 -%}
          {%- set heat_exit = min_temp + 1.3 -%}
          {%- if current_temp <= heat_enter -%}
            heating_guard
          {%- elif current_temp >= heat_exit -%}
            cooling_guard
          {%- elif effective_profile in ['heating_guard', 'cooling_guard'] -%}
            {{ effective_profile }}
          {%- else -%}
            cooling_guard
          {%- endif -%}
        target_command: "{{ (target_profile | trim) ~ ':' ~ (min_temp | round(1)) ~ ':' ~ (max_temp | round(1)) }}"
        dwell_ok: >
          {% set last_command = states('input_datetime.warehouse_cell_last_profile_command') %}
          {% if last_command in ['unknown', 'unavailable', 'none', ''] %}
            true
          {% else %}
            {% set last_command_ts = as_timestamp(last_command) %}
            {{ last_command_ts is none or (as_timestamp(now()) - last_command_ts) >= 7200 }}
          {% endif %}
        dwell_bypass: "{{ trigger.id in ['limit_change', 'manual_hold_released', 'startup'] }}"
        write_allowed: "{{ (dwell_ok | bool) or (dwell_bypass | bool) or (needs_profile_reapply | bool) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ (target_command != last_requested_command or (needs_profile_reapply | bool)) and (write_allowed | bool) }}"
          sequence:
            - action: nector200.apply_profile
              data:
                entity_id: sensor.wh1_temperature
                profile: "{{ target_profile | trim }}"
                min_temp: "{{ min_temp }}"
                max_temp: "{{ max_temp }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.warehouse_cell_last_requested_profile
              data:
                value: "{{ target_profile | trim }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.warehouse_cell_last_requested_command
              data:
                value: "{{ target_command }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.warehouse_cell_last_profile_command
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - conditions:
            - condition: template
              value_template: "{{ (target_command != last_requested_command or (needs_profile_reapply | bool)) and not (write_allowed | bool) }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: warehouse_cell_profile_guard
                title: "Warehouse cell profile held"
                message: >
                  Target {{ target_profile | trim }} skipped because profile dwell time has not elapsed.
  mode: single
- id: warehouse_cell_watchdog_monitor
  alias: Warehouse Cell NECTOR Watchdog Monitor
  description: >
    Temporary 72-hour watchdog for NECTOR profile, temperature, and output
    sanity while the new warehouse-cell guard logic settles in.
  triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: time_pattern
      minutes: "/15"
      id: periodic
    - trigger: state
      entity_id:
        - input_number.warehouse_cell_min_temperature
        - input_number.warehouse_cell_max_temperature
        - input_boolean.warehouse_cell_manual_hold
        - input_boolean.warehouse_cell_watchdog_enabled
        - input_datetime.warehouse_cell_watchdog_until
        - sensor.wh1_temperature
        - sensor.wh1_probe_s3_temperature
        - sensor.wh1_last_applied_profile
        - sensor.wh1_last_profile_error
        - binary_sensor.wh1_compressor
        - binary_sensor.wh1_fan
        - binary_sensor.wh1_hot_resistance
      id: state_change
  conditions:
    - condition: state
      entity_id: input_boolean.warehouse_cell_watchdog_enabled
      state: "on"
    - condition: template
      value_template: >
        {% set until_ts = as_timestamp(states('input_datetime.warehouse_cell_watchdog_until')) %}
        {{ until_ts is not none and as_timestamp(now()) <= until_ts }}
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger is defined and trigger.id == 'startup' }}"
      then:
        - delay: "00:02:00"
    - variables:
        issues: >
          {% set min_v = states('input_number.warehouse_cell_min_temperature') | float(none) %}
          {% set max_v = states('input_number.warehouse_cell_max_temperature') | float(none) %}
          {% set s1 = states('sensor.wh1_temperature') | float(none) %}
          {% set profile = states('sensor.wh1_last_applied_profile') | trim %}
          {% set profile_error = states('sensor.wh1_last_profile_error') | trim | lower %}
          {% set manual_hold = is_state('input_boolean.warehouse_cell_manual_hold', 'on') %}
          {% set compressor_on = is_state('binary_sensor.wh1_compressor', 'on') %}
          {% set heat_on = is_state('binary_sensor.wh1_hot_resistance', 'on') %}
          {% set ns = namespace(items=[]) %}
          {% if min_v is none or max_v is none or s1 is none %}
            {% set ns.items = ns.items + ['CRITICAL: S1 temperature or min/max helpers are unavailable.'] %}
          {% elif min_v >= max_v %}
            {% set ns.items = ns.items + ['CRITICAL: warehouse min temperature is not below max temperature.'] %}
          {% else %}
            {% if s1 > max_v + 1.5 %}
              {% set ns.items = ns.items + ['CRITICAL: S1 is ' ~ (s1 | round(1)) ~ ' C, above high guard ' ~ ((max_v + 1.5) | round(1)) ~ ' C.'] %}
            {% elif s1 > max_v + 0.8 %}
              {% set ns.items = ns.items + ['WARNING: S1 is ' ~ (s1 | round(1)) ~ ' C, above warning guard ' ~ ((max_v + 0.8) | round(1)) ~ ' C.'] %}
            {% endif %}
            {% if s1 < min_v - 0.5 %}
              {% set ns.items = ns.items + ['CRITICAL: S1 is ' ~ (s1 | round(1)) ~ ' C, below low guard ' ~ ((min_v - 0.5) | round(1)) ~ ' C.'] %}
            {% elif s1 < min_v - 0.3 %}
              {% set ns.items = ns.items + ['WARNING: S1 is ' ~ (s1 | round(1)) ~ ' C, below warning guard ' ~ ((min_v - 0.3) | round(1)) ~ ' C.'] %}
            {% endif %}
          {% endif %}
          {% if manual_hold %}
            {% set ns.items = ns.items + ['WARNING: manual hold is on, so NECTOR profile writes are disabled.'] %}
          {% elif profile not in ['cooling_guard', 'heating_guard'] %}
            {% set ns.items = ns.items + ['WARNING: active NECTOR profile is ' ~ profile ~ '.'] %}
          {% endif %}
          {% if profile_error not in ['', 'none', 'unknown', 'unavailable'] %}
            {% set ns.items = ns.items + ['WARNING: last NECTOR profile error is ' ~ profile_error ~ '.'] %}
          {% endif %}
          {% if compressor_on and heat_on %}
            {% set ns.items = ns.items + ['CRITICAL: compressor and hot resistance are both on.'] %}
          {% endif %}
          {{ ns.items | join('\n') }}
        status_level: >
          {% if 'CRITICAL:' in issues %}
            CRITICAL
          {% elif issues | trim != '' %}
            WARNING
          {% else %}
            OK
          {% endif %}
        status_summary: >
          {% set min_v = states('input_number.warehouse_cell_min_temperature') | float(none) %}
          {% set max_v = states('input_number.warehouse_cell_max_temperature') | float(none) %}
          {% set s1 = states('sensor.wh1_temperature') | float(none) %}
          {% set s3 = states('sensor.wh1_probe_s3_temperature') | float(none) %}
          {% set profile = states('sensor.wh1_last_applied_profile') | trim %}
          {{ now().strftime('%d %H:%M') }} {{ status_level | trim }} S1={{ (s1 | round(1)) if s1 is not none else '?' }} S3={{ (s3 | round(1)) if s3 is not none else '?' }} lim={{ (min_v | round(1)) if min_v is not none else '?' }}-{{ (max_v | round(1)) if max_v is not none else '?' }} prof={{ profile }} comp={{ states('binary_sensor.wh1_compressor') }} fan={{ states('binary_sensor.wh1_fan') }} heat={{ states('binary_sensor.wh1_hot_resistance') }}
        watchdog_message: >
          {{ issues | trim }}

          S1: {{ states('sensor.wh1_temperature') }} C
          S3: {{ states('sensor.wh1_probe_s3_temperature') }} C
          Limits: {{ states('input_number.warehouse_cell_min_temperature') }} C to {{ states('input_number.warehouse_cell_max_temperature') }} C
          Profile: {{ states('sensor.wh1_last_applied_profile') }}
          Last command: {{ states('input_text.warehouse_cell_last_requested_command') }}
          Last profile write: {{ states('sensor.wh1_last_profile_write') }}
          Outputs: compressor={{ states('binary_sensor.wh1_compressor') }}, fan={{ states('binary_sensor.wh1_fan') }}, heat={{ states('binary_sensor.wh1_hot_resistance') }}
          Watchdog active until: {{ states('input_datetime.warehouse_cell_watchdog_until') }}
    - action: input_text.set_value
      target:
        entity_id: input_text.warehouse_cell_watchdog_last_status
      data:
        value: "{{ status_summary[:255] }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ issues | trim != '' }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: warehouse_cell_watchdog
                title: "Warehouse cell watchdog {{ status_level | trim | lower }}"
                message: "{{ watchdog_message }}"
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: warehouse_cell_watchdog
  mode: restart
- id: warehouse_cell_watchdog_heartbeat
  alias: Warehouse Cell NECTOR Watchdog Heartbeat
  description: >
    Twice-daily heartbeat proving the temporary warehouse-cell watchdog is
    still active during the observation window.
  triggers:
    - trigger: time
      at:
        - "08:00:00"
        - "20:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.warehouse_cell_watchdog_enabled
      state: "on"
    - condition: template
      value_template: >
        {% set until_ts = as_timestamp(states('input_datetime.warehouse_cell_watchdog_until')) %}
        {{ until_ts is not none and as_timestamp(now()) <= until_ts }}
  actions:
    - action: persistent_notification.create
      data:
        notification_id: warehouse_cell_watchdog_heartbeat
        title: "Warehouse cell watchdog heartbeat"
        message: >
          Watchdog heartbeat at {{ now().strftime('%Y-%m-%d %H:%M') }}.

          S1: {{ states('sensor.wh1_temperature') }} C
          S3: {{ states('sensor.wh1_probe_s3_temperature') }} C
          Limits: {{ states('input_number.warehouse_cell_min_temperature') }} C to {{ states('input_number.warehouse_cell_max_temperature') }} C
          Profile: {{ states('sensor.wh1_last_applied_profile') }}
          Setpoint: {{ states('sensor.wh1_setpoint') }} C
          Outputs: compressor={{ states('binary_sensor.wh1_compressor') }}, fan={{ states('binary_sensor.wh1_fan') }}, heat={{ states('binary_sensor.wh1_hot_resistance') }}
          Watchdog active until: {{ states('input_datetime.warehouse_cell_watchdog_until') }}
  mode: single
- id: summer_dynamic_temp_adjust
  alias: Summer Dynamic Temperature Adjustment [DEPRECATED]
  description: >
    DEPRECATED 2026-05-27. Per-zone VT presets are now fixed (offices comfort
    25.5, common 27, eco 29, boost 24/25). Drift from this automation
    overwriting comfort_temp every 30 min was the user-visible "presets keep
    changing" symptom. initial_state false to keep disabled across reloads.
  initial_state: false
  triggers:
  - trigger: time_pattern
    minutes: '/30'
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  actions:
  - variables:
      office_comfort: "{{ states('sensor.summer_comfort_office') | float(25) }}"
      common_comfort: "{{ states('sensor.summer_comfort_common') | float(26) }}"
      office_eco: "{{ states('sensor.summer_eco_office') | float(28) }}"
      common_eco: "{{ states('sensor.summer_eco_common') | float(29) }}"
      # Office zones — comfort target driven by Summer Comfort Office sensor
      # (24-27 °C scaled by outdoor). All zones using the office cool-mode
      # presets (comfort_ac_temp 25) go here. CS and Meeting are eco-by-default
      # but if manually pulled to comfort, the dynamic temp scales their target.
      office_zones:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.projects_2
      - climate.fancoil_reception
      - climate.fancoil_cs
      - climate.fancoil_meeting
      # Common zones — comfort target driven by Summer Comfort Common sensor
      # (25-28 °C scaled by outdoor). Only zones inheriting Central preset
      # config (comfort_ac_temp 26) go here.
      common_zones:
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      # Mensa is intentionally NOT in either list. It has its own static
      # comfort_ac_temp = 26 °C per the user's "26 all day" preference,
      # and lunch is handled by mensa_lunch_boost with boost_ac_temp = 24.5.
  - repeat:
      for_each: "{{ office_zones }}"
      sequence:
      - condition: template
        value_template: >
          {{ state_attr(repeat.item, 'preset_mode') == 'comfort' }}
      - action: climate.set_temperature
        target:
          entity_id: "{{ repeat.item }}"
        data:
          temperature: "{{ office_comfort }}"
  - repeat:
      for_each: "{{ common_zones }}"
      sequence:
      - condition: template
        value_template: >
          {{ state_attr(repeat.item, 'preset_mode') == 'comfort' }}
      - action: climate.set_temperature
        target:
          entity_id: "{{ repeat.item }}"
        data:
          temperature: "{{ common_comfort }}"
  mode: single
- id: office_climate_schedule
  alias: Office Climate Schedule
  description: >
    Office workspaces (Dagmar, Tania, Projects 1, Reception):
    **comfort preset held 07:30–18:00** (target 25.5 °C), then **frost from
    18:00** (target 30 °C = no cooling, aligns with chiller hard-off at 18:00).
    Workdays only.

    2026-06-18 change (Dagmar): keep comfort until 18:00, do NOT drop to eco at
    17:00. Implemented by making the 17:00 eco slot re-apply comfort
    (eco_preset=comfort, a no-op keep) and moving frost_time 17:30 → 18:00.

    CS moved to own eco-by-default schedule 2026-05-26; Projects 2 moved BACK
    to common 2026-06-04 (P2 currently unoccupied, behaves as common space).
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_reception
      comfort_time: '08:00:00'
      eco_time: '17:00:00'
      frost_time: '18:00:00'
      enable_preheat: true
      preheat_time: '07:30:00'
      comfort_preset: comfort
      # eco slot re-applies comfort (keep comfort until 18:00, no 17:00 drop)
      eco_preset: comfort
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: common_climate_schedule
  alias: Common Spaces Climate Schedule (comfort-default @ 27)
  description: >
    Common open areas (OpenSpace, Entrance): COMFORT-default during work hours
    — target 27 °C (COMMON comfort_ac_temp). 2026-06-20 redesign reverses the
    earlier eco-by-default: common spaces now follow the same calendar as the
    occupied offices (comfort 08:00–18:00) but at their own 27 °C comfort.

    comfort 07:30–18:00 → **boil (frost @ 31) from 18:00** and all weekend.
    The 17:00 slot re-applies comfort (eco_preset=comfort) so comfort holds
    until 18:00. Manual override to eco possible if a space is unused.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      comfort_time: '08:00:00'
      eco_time: '17:00:00'
      frost_time: '18:00:00'
      enable_preheat: true
      preheat_time: '07:30:00'
      comfort_preset: comfort
      # eco slot re-applies comfort → comfort held until 18:00 (no 17:00 drop)
      eco_preset: comfort
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: cs_climate_schedule
  alias: CS + Projects 2 Climate Schedule (eco-default, hold all day)
  description: >
    Customer Service and Projects 2: eco-default. The 08:00 "comfort" slot
    fires `eco`, and there is NO mid-day transition, so a manual override
    (comfort/boost) HOLDS until 18:00 — CS is usually occupied all day. At
    18:00 both evening slots resolve to **boil (frost @ 30)**, and the room
    stays in boil overnight + weekends.

    Projects 2 added here 2026-06-20 (eco-default, re-staffed). Note: P2's VT
    may still need a one-time Options-flow reconfigure to fully un-wedge.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_cs
      - climate.projects_2
      comfort_time: '08:00:00'
      # No 17:00 transition: both eco + frost slots fire at 18:00 → boil(frost),
      # so a manual comfort/boost holds until 18:00.
      eco_time: '18:00:00'
      frost_time: '18:00:00'
      enable_preheat: true
      preheat_time: '07:30:00'
      comfort_preset: eco
      eco_preset: none
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: meeting_climate_schedule
  alias: Meeting Room Climate Schedule (eco-default, 1 h manual revert)
  description: >
    Meeting Room: eco-default. 08:00 sets eco; no mid-day transition. When the
    room is used, manually set comfort/boost — the separate
    `meeting_manual_revert` automation returns it to eco 1 hour later. At 18:00
    → **boil (frost @ 30)**, held overnight + weekends.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_meeting
      comfort_time: '08:00:00'
      eco_time: '18:00:00'
      frost_time: '18:00:00'
      comfort_preset: eco
      eco_preset: none
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: mensa_climate_schedule
  alias: Mensa Climate Schedule (eco-default, lunch boost, boil 18:00)
  description: >
    Mensa: eco-default (target 27 °C) 08:00–18:00, with a lunch BOOST (target
    24 °C) 12:00–14:00 via the separate `mensa_lunch_boost` automation. No
    mid-day eco re-assert, so a manual override holds. At 18:00 → **boil
    (frost @ 30)**, held overnight + weekends. 2026-06-20: moved from
    comfort-default to eco-default; frost_time 19:00 → 18:00.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.climate_mensa
      comfort_time: '08:00:00'
      eco_time: '18:00:00'
      frost_time: '18:00:00'
      comfort_preset: eco
      eco_preset: none
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: mensa_lunch_boost
  alias: Mensa Lunch Boost (12-14)
  description: >
    Mensa lunch break: stronger cooling from 12:00 to 14:00 to handle the
    body-heat + cooking load. Sets the boost preset (cool-mode boost_ac_temp
    for Mensa = 24.5 °C). At 14:00 sets back to comfort (26 °C).
    Note: Mensa is EXEMPT from boost_auto_revert (which would otherwise
    auto-cancel after 60 min), so this 2-hour window is honoured fully.
  triggers:
  - trigger: time
    at: '12:00:00'
    id: lunch_start
  - trigger: time
    at: '14:00:00'
    id: lunch_end
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: lunch_start
      sequence:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.climate_mensa
        data:
          preset_mode: boost
    - conditions:
      - condition: trigger
        id: lunch_end
      sequence:
      # Mensa is eco-default (2026-06-20): after lunch boost, return to eco.
      - action: climate.set_preset_mode
        target:
          entity_id: climate.climate_mensa
        data:
          preset_mode: eco
  mode: single
- id: boost_auto_revert
  alias: Boost Auto-Revert (→ comfort after 60 min or target reached)
  description: >
    2026-06-20: when a user sets a VT to boost, revert it to COMFORT after
    whichever comes first — target temperature reached or 60 minutes.
    EXEMPT: climate.climate_mensa (its lunch boost runs a full 2 h via
    mensa_lunch_boost) and climate.fancoil_meeting (Meeting reverts to ECO
    after 1 h via meeting_manual_revert — its rule wins).
  mode: parallel
  max: 9
  triggers:
  - trigger: state
    entity_id:
    - climate.fancoil_dagmar
    - climate.fancoil_tania
    - climate.projects_1
    - climate.fancoil_cs
    - climate.fancoil_reception
    - climate.fancoil_openspace
    - climate.fancoil_entrance
    - climate.projects_2
    attribute: preset_mode
    to: boost
  actions:
  - variables:
      vt: "{{ trigger.entity_id }}"
  - wait_template: >
      {% set current = state_attr(vt, 'current_temperature') | float(0) %}
      {% set target = state_attr(vt, 'temperature') | float(99) %}
      {{ states(vt) == 'cool' and current <= target }}
    timeout: '01:00:00'
    continue_on_timeout: true
  # Only revert if still in boost (user may have changed it meanwhile)
  - condition: template
    value_template: "{{ state_attr(vt, 'preset_mode') == 'boost' }}"
  - action: climate.set_preset_mode
    target:
      entity_id: "{{ vt }}"
    data:
      preset_mode: comfort

- id: meeting_manual_revert
  alias: Meeting Manual Override Revert (→ eco after 1 h)
  description: >
    2026-06-20: Meeting Room is eco-default but occasionally used. Any manual
    override to comfort or boost reverts to eco 1 hour later (set comfort 10:30
    → eco 11:30). mode=restart so a fresh override restarts the hour. Only
    reverts during office hours (08:00–18:00); after 18:00 the boil schedule
    governs, so it leaves it alone.
  mode: restart
  triggers:
  - trigger: state
    entity_id: climate.fancoil_meeting
    attribute: preset_mode
    to:
    - comfort
    - boost
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - delay: '01:00:00'
  - condition: template
    value_template: "{{ state_attr('climate.fancoil_meeting','preset_mode') in ['comfort','boost'] }}"
  - condition: time
    after: '08:00:00'
    before: '18:00:00'
  - action: climate.set_preset_mode
    target:
      entity_id: climate.fancoil_meeting
    data:
      preset_mode: eco

- id: cs_sun_shade
  alias: CS Sun Shade (Morning) [DEPRECATED - replaced by sun_shade_cs blueprint]
  description: >
    DEPRECATED 2026-05-27. Replaced by sun_shade_cs (intelligent_sun_shade blueprint).
    Initial_state false so it stays disabled on reload; safe to delete later.
  initial_state: false
  mode: single
  triggers:
  - trigger: time
    at: '08:00:00'
    id: sun_check
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    below: 50
    id: sun_check
  - trigger: time
    at: '11:00:00'
    id: sun_past
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    above: 70
    id: cloudy
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sun_check
      - condition: time
        after: '08:00:00'
        before: '11:00:00'
      - condition: numeric_state
        entity_id: weather.forecast_home
        attribute: cloud_coverage
        below: 50
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: numeric_state
        entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        attribute: current_position
        above: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        data:
          position: 30
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: sun_past
        - condition: trigger
          id: cloudy
      - condition: numeric_state
        entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        attribute: current_position
        below: 50
      # Skip the 11:00 open on warm/hot days — leave shade lowered through
      # the afternoon to block ambient solar load. Clouds always open
      # regardless of forecast.
      - condition: or
        conditions:
        - condition: trigger
          id: cloudy
        - condition: numeric_state
          entity_id: input_number.shade_today_outdoor_max_forecast
          below: 28
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        data:
          position: 100

- id: sun_shade_forecast_populator
  alias: Sun Shade — Populate today's outdoor max forecast
  description: >
    Calls weather.get_forecasts (the modern replacement for the deprecated
    forecast attribute) and writes today's max temperature into
    input_number.shade_today_outdoor_max_forecast so the blueprint can
    read it from a simple numeric_state condition.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "06:00:00"
    - trigger: time_pattern
      minutes: 5
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_response
    - variables:
        today_max: >
          {% set fc = forecast_response['weather.forecast_home'].forecast %}
          {% if fc and fc | length > 0 %}
            {{ fc[0].temperature | float(0) }}
          {% else %}
            0
          {% endif %}
    - action: input_number.set_value
      target:
        entity_id: input_number.shade_today_outdoor_max_forecast
      data:
        value: "{{ today_max }}"

- id: sun_shade_midnight_reset
  alias: Sun Shade — Midnight counter reset
  description: >
    Resets per-room manual-override counters at 00:00:01 so the nightly
    evaluator (which runs at 21:00 UTC, before local midnight) sees the
    full day's counts, and the next day starts fresh.
  mode: single
  triggers:
    - trigger: time
      at: "00:00:01"
  actions:
    - action: counter.reset
      target:
        entity_id:
          - counter.meeting_room_manual_override_count
          - counter.mensa_manual_override_count

