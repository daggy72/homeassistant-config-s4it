- id: '1770681600001'
  alias: Seasonal Climate Mode Switch
  description: >
    Switch all VT fancoil entities between heat/cool/off based on the
    climate_season selector. Controls chiller (respecting the 10-min
    min-cycle rule on transitions). Forces comfort preset after mode
    change to prevent the 0 °C frost bug (unconfigured cool-mode presets).
    NOTE: chiller cold-water delivery to fancoils takes ~10-15 min (measured
    2026-05-24). On weekday mornings the separate "Chiller Pre-start"
    automation fires first so cold water is already flowing by the time
    a user-initiated summer switch happens; if no pre-start, expect
    ~15 min of warm-air blowing before useful cooling begins.
  triggers:
  - trigger: state
    entity_id: input_select.climate_season
  conditions: []
  actions:
  - variables:
      # Projects 2 REMOVED 2026-06-09 — unoccupied, kept dormant (off).
      # See common_climate_schedule note. Re-add when reoccupied.
      all_thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_cs
      - climate.fancoil_reception
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      - climate.projects_2
      new_season: "{{ states('input_select.climate_season') }}"
      chiller_last_changed_age: >
        {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() }}
      chiller_min_cycle_ok: >
        {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ all_thermostats }}"
    data:
      hvac_mode: "off"
  - delay:
      seconds: 5
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ new_season == 'winter' }}"
      sequence:
      # Heating doesn't use the chiller — turn it off if it has been on long enough
      - if:
        - condition: template
          value_template: >
            {{ is_state('switch.shellypro4pm_ece334eaf568_switch_2', 'on') and chiller_min_cycle_ok }}
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.shellypro4pm_ece334eaf568_switch_2
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          hvac_mode: heat
      # Force comfort preset so VTs land on a sane setpoint
      - action: climate.set_preset_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          preset_mode: comfort
    - conditions:
      - condition: template
        value_template: "{{ new_season == 'summer' }}"
      sequence:
      # Cooling needs the chiller — turn it on if it has been off long enough
      - if:
        - condition: template
          value_template: >
            {{ is_state('switch.shellypro4pm_ece334eaf568_switch_2', 'off') and chiller_min_cycle_ok }}
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.shellypro4pm_ece334eaf568_switch_2
      - delay:
          seconds: 5
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          hvac_mode: cool
      # Force comfort preset so VTs don't land on boost/frost with 0 °C target
      # (Summer Dynamic Temperature Adjustment then keeps comfort temp tuned)
      - action: climate.set_preset_mode
        target:
          entity_id: "{{ all_thermostats }}"
        data:
          preset_mode: comfort
    - conditions:
      - condition: template
        value_template: "{{ new_season == 'off' }}"
      sequence:
      # Season=off: ensure chiller is off (respecting min-cycle)
      - if:
        - condition: template
          value_template: >
            {{ is_state('switch.shellypro4pm_ece334eaf568_switch_2', 'on') and chiller_min_cycle_ok }}
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single
- id: morning_vt_alignment
  alias: Morning VT Alignment (workday)
  description: >
    Each workday at 07:00, ensure every VT's hvac_mode matches the
    current season selector and every VT is in `comfort` preset.
    Recovers from manual VT-off overrides done the previous evening,
    weekend HA restarts, or any other condition that left VTs out of
    sync with input_select.climate_season. Does NOT touch the chiller
    (handled separately by Chiller Pre-start, which fires at 06:30).
    Skips entirely on non-workdays.
  triggers:
  - trigger: time
    at: '07:00:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - variables:
      # Projects 2 REMOVED 2026-06-09 — unoccupied, kept dormant (off).
      # See common_climate_schedule note. Re-add when reoccupied.
      all_thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_cs
      - climate.fancoil_reception
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      - climate.projects_2
      season: "{{ states('input_select.climate_season') }}"
      target_hvac: >
        {% if season == 'summer' %}cool
        {% elif season == 'winter' %}heat
        {% else %}off
        {% endif %}
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ all_thermostats }}"
    data:
      hvac_mode: "{{ target_hvac | trim }}"
  # NOTE: no preset forced here (2026-06-22 cleanup). The per-zone schedules
  # own the preset (comfort for offices, eco for eco-default rooms); forcing
  # comfort here used to override the eco-default rooms for an hour.
  mode: single
- id: ha_startup_climate_restore
  alias: HA Startup — Climate Restore
  description: >
    On Home Assistant startup, re-apply the climate_season's hvac_mode to all
    VTs. Defends against HA restarts mid-season where VTs might come back in
    an off state. Does NOT touch preset_mode — leaves restored preset alone
    (correct for time-of-day since the schedule blueprints had already set
    eco/frost/comfort before the restart).

    Does NOT touch the chiller — that's managed by Chiller Pre-start (morning)
    and Chiller End-of-day Off (evening).

    History:
    - 2026-05-26 T22 fix #1: switched trigger from `homeassistant`/`event: start`
      to `event`/`event_type: homeassistant_started` (waits for all integrations
      to finish setup). Still misses sometimes due to registration-vs-event race.
    - 2026-05-26 T22 fix #2 (this version): REMOVED the unconditional preset-
      force to `comfort`. Original purpose was killing the 0 °C frost bug, but
      T5 (per-VT cool-mode presets configured) made that defense obsolete.
      Forcing comfort at evening restarts caused over-cooling at 21:30 (target
      25 °C in a 30 °C room → max demand).
  triggers:
  - trigger: event
    event_type: homeassistant_started
  conditions: []
  actions:
  # Short additional delay for VT's per-entity async init to settle after
  # the homeassistant_started event.
  - delay:
      seconds: 30
  - variables:
      # Projects 2 REMOVED 2026-06-09 — unoccupied, kept dormant (off).
      # See common_climate_schedule note. Re-add when reoccupied.
      all_thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_cs
      - climate.fancoil_reception
      - climate.fancoil_meeting
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      - climate.climate_mensa
      - climate.projects_2
      season: "{{ states('input_select.climate_season') }}"
      target_hvac: >
        {% if season == 'summer' %}cool
        {% elif season == 'winter' %}heat
        {% else %}off
        {% endif %}
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ all_thermostats }}"
    data:
      hvac_mode: "{{ target_hvac | trim }}"
  # NOTE: intentionally NOT touching preset_mode. Restored preset from
  # restore_state is correct for current time-of-day (schedule blueprints
  # had set eco/frost/comfort before the restart). Forcing comfort here
  # caused over-cooling at evening restarts (2026-05-26 21:24 incident).
  mode: single
# 2026-06-20: chiller_end_of_day_off (18:00 hard-off) and
# chiller_safety_off_weekend REMOVED. They blocked the demand-driven model and
# weekend boil protection. The chiller now follows real cooling demand 7 days a
# week (chiller_on_demand on / chiller_idle_off_no_demand off), so it switches
# off on its own when nothing needs cooling and stays available when a room
# overheats — including after 18:00 and on weekends.

- id: chiller_on_demand
  alias: Chiller On — cooling demand (fancoil interlock)
  description: >
    2026-06-20 interlock fix: the chiller must be ON whenever ANY VT is actually
    cooling, so fancoils never blow warm air over an uncooled coil (the Saturday
    waste bug). Runs 7 days/week incl. weekends for boil protection. Turns the
    chiller on when a zone demands cooling and the chiller is off. Respects the
    10-min min-cycle. The OFF side is chiller_idle_off_no_demand.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: '/3'
  - trigger: state
    entity_id:
    - climate.fancoil_dagmar
    - climate.fancoil_tania
    - climate.projects_1
    - climate.fancoil_cs
    - climate.fancoil_reception
    - climate.fancoil_meeting
    - climate.fancoil_openspace
    - climate.fancoil_entrance
    - climate.climate_mensa
    - climate.projects_2
    attribute: hvac_action
    to: cooling
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'off'
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  - condition: template
    value_template: >
      {% set zones = [
        'climate.fancoil_dagmar','climate.fancoil_tania','climate.projects_1',
        'climate.fancoil_cs','climate.fancoil_reception','climate.fancoil_meeting',
        'climate.fancoil_openspace','climate.fancoil_entrance','climate.climate_mensa',
        'climate.projects_2'] %}
      {{ zones | map('state_attr','hvac_action') | select('eq','cooling') | list | length > 0 }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single

- id: heatwave_morning_precool
  alias: Heatwave Morning Pre-cool (06:00 warm workdays)
  description: >
    2026-06-22 (Dagmar, hot week): on warm/hot WORKDAY mornings, start BOTH the
    chiller AND daytime cooling at 06:00 (not 08:00) so rooms reach target before
    staff arrive. Yesterday the chiller was on early but rooms weren't put into
    cooling until 08:00, so the building stayed warm. Fires if today's forecast
    max >= 26 C. The fancoil<->chiller interlock keeps fans off until the water
    is cold (~3 min), so no warm air. The boil enforcer ends its workday
    overnight window at 06:00 so it doesn't undo this.
    Engages comfort on the always-occupied offices + common spaces, eco on the
    eco-default rooms (CS/Meeting/Mensa/P2). The 08:00 schedule then takes over.
  mode: single
  triggers:
  - trigger: time
    at: '06:00:00'
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.outdoor_forecast_max_today
    above: 26
  actions:
  # Chiller on (if off + min-cycle); interlock holds fans off until cold.
  - if:
    - condition: state
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
      state: 'off'
    - condition: template
      value_template: >
        {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  # Engage daytime cooling early (zones are already in cool mode from boil)
  - action: climate.set_preset_mode
    target:
      entity_id:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_reception
      - climate.fancoil_openspace
      - climate.fancoil_entrance
    data:
      preset_mode: comfort
  - action: climate.set_preset_mode
    target:
      entity_id:
      - climate.fancoil_cs
      - climate.fancoil_meeting
      - climate.climate_mensa
      - climate.projects_2
    data:
      preset_mode: eco
  mode: single

- id: chiller_idle_off_no_demand
  alias: Chiller Idle Off — no cooling demand (sustained 30 min)
  description: >
    OFF side of the demand-driven chiller (with chiller_on_demand). Turns the
    chiller off only after NO VT has been cooling for a SUSTAINED 30 minutes —
    not on a brief lull. This avoids the failure mode where an eager idle-off
    drops the chiller during a short gap, then demand returns inside the 10-min
    min-cycle lockout, leaving fancoils blowing warm air (observed 2026-06-20).
    On hot days with continuous demand it simply never fires. Respects the
    10-min min-cycle. Runs 7 days/week.
  mode: single
  triggers:
  - trigger: template
    value_template: >
      {% set zones = [
        'climate.fancoil_dagmar','climate.fancoil_tania','climate.projects_1',
        'climate.fancoil_cs','climate.fancoil_reception','climate.fancoil_meeting',
        'climate.fancoil_openspace','climate.fancoil_entrance','climate.climate_mensa',
        'climate.projects_2'] %}
      {{ zones | map('state_attr','hvac_action') | select('eq','cooling') | list | length == 0 }}
    for: '00:30:00'
  conditions:
  - condition: state
    entity_id: switch.shellypro4pm_ece334eaf568_switch_2
    state: 'on'
  - condition: template
    value_template: >
      {{ (now() - states.switch.shellypro4pm_ece334eaf568_switch_2.last_changed).total_seconds() >= 600 }}
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.shellypro4pm_ece334eaf568_switch_2
  mode: single

- id: offhours_boil_enforcer
  alias: Off-hours / Weekend Boil Protection Enforcer
  description: >
    Makes boil protection actually run. During summer, on non-workdays OR
    outside office hours (18:00–08:00), every VT must sit in COOL mode at the
    BOIL target (office 30 / common 31) so it idles until a room exceeds it,
    then cools it back down (demand-driven chiller follows). Runs every 10 min
    + on HA start + at 18:00.

    2026-06-21 fix: the VTs have NO selectable 'frost' preset (preset_modes =
    none/eco/comfort/boost), so set_preset_mode('frost') errored and nothing
    applied. Boil is now done as preset 'none' + set_temperature to the boil
    target. This also clears any stale 0 °C target (e.g. Projects 2).
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: time_pattern
    minutes: '/10'
  - trigger: homeassistant
    event: start
  - trigger: time
    at: '18:00:00'
  conditions:
  - condition: state
    entity_id: input_select.climate_season
    state: summer
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: 'off'
    # Workday overnight boil ends at 06:00 so heatwave_morning_precool can
    # engage cooling at 06:00 without the enforcer immediately re-boiling it.
    # (On cool days nothing cools 06:00-08:00; the 08:00 schedule takes over.)
    - condition: time
      after: '18:00:00'
      before: '06:00:00'
  actions:
  - variables:
      # Boil target = 30 for ALL zones. The VT setpoint slider max_temp is 30
      # on every zone (global VT limit), so 31 is out of range — common is
      # capped at 30 too. Raising it would need the VT temp range reconfigured.
      boil_map:
        climate.fancoil_dagmar: 30
        climate.fancoil_tania: 30
        climate.projects_1: 30
        climate.fancoil_reception: 30
        climate.fancoil_cs: 30
        climate.fancoil_meeting: 30
        climate.climate_mensa: 30
        climate.projects_2: 30
        climate.fancoil_openspace: 30
        climate.fancoil_entrance: 30
  - repeat:
      for_each: "{{ boil_map.keys() | list }}"
      sequence:
      - variables:
          z: "{{ repeat.item }}"
          boil: "{{ boil_map[repeat.item] | float }}"
      - if:
        - condition: template
          value_template: "{{ states(z) not in ['cool','unavailable','unknown'] }}"
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: "{{ z }}"
          data:
            hvac_mode: cool
      - if:
        - condition: template
          value_template: "{{ state_attr(z,'preset_mode') != 'none' }}"
        then:
        - action: climate.set_preset_mode
          target:
            entity_id: "{{ z }}"
          data:
            preset_mode: none
      - if:
        - condition: template
          value_template: "{{ (state_attr(z,'temperature') | float(0)) != boil }}"
        then:
        - action: climate.set_temperature
          target:
            entity_id: "{{ z }}"
          data:
            temperature: "{{ boil }}"

- id: warehouse_cell_profile_guard
  alias: Warehouse Cell Profile Guard
  description: >
    Applies NECTOR cooling/heating guard profiles from operator min/max helpers.
    Keeps cooling as the default passive stock-protection profile and enables
    heating only below the low guard. Manual hold prevents writes. Reapplies the
    last requested profile after Home Assistant restart because the integration
    diagnostic profile state is memory-only.
  triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: state
      entity_id:
        - input_number.warehouse_cell_min_temperature
        - input_number.warehouse_cell_max_temperature
      id: limit_change
    - trigger: state
      entity_id: sensor.wh1_temperature
      id: temperature_change
    - trigger: state
      entity_id: input_boolean.warehouse_cell_manual_hold
      to: "off"
      id: manual_hold_released
    - trigger: time_pattern
      minutes: "/15"
      id: periodic
  conditions:
    - condition: state
      entity_id: input_boolean.warehouse_cell_manual_hold
      state: "off"
    - condition: template
      value_template: >
        {% set min_temp = states('input_number.warehouse_cell_min_temperature') | float(none) %}
        {% set max_temp = states('input_number.warehouse_cell_max_temperature') | float(none) %}
        {% set current_temp = states('sensor.wh1_temperature') | float(none) %}
        {{ min_temp is not none and max_temp is not none and current_temp is not none and min_temp < max_temp and (max_temp - min_temp) >= 2.0 }}
  actions:
    - variables:
        min_temp: "{{ states('input_number.warehouse_cell_min_temperature') | float(none) }}"
        max_temp: "{{ states('input_number.warehouse_cell_max_temperature') | float(none) }}"
        current_temp: "{{ states('sensor.wh1_temperature') | float(none) }}"
        active_profile: "{{ states('sensor.wh1_last_applied_profile') | trim }}"
        needs_profile_reapply: "{{ active_profile not in ['heating_guard', 'cooling_guard'] }}"
        last_requested_profile: "{{ states('input_text.warehouse_cell_last_requested_profile') | trim }}"
        last_requested_command: "{{ states('input_text.warehouse_cell_last_requested_command') | trim }}"
        effective_profile: >
          {%- if active_profile in ['heating_guard', 'cooling_guard'] -%}
            {{ active_profile }}
          {%- else -%}
            {{ last_requested_profile }}
          {%- endif -%}
        target_profile: >
          {%- set heat_enter = min_temp + 0.3 -%}
          {%- set heat_exit = min_temp + 1.3 -%}
          {%- if current_temp <= heat_enter -%}
            heating_guard
          {%- elif current_temp >= heat_exit -%}
            cooling_guard
          {%- elif effective_profile in ['heating_guard', 'cooling_guard'] -%}
            {{ effective_profile }}
          {%- else -%}
            cooling_guard
          {%- endif -%}
        target_command: "{{ (target_profile | trim) ~ ':' ~ (min_temp | round(1)) ~ ':' ~ (max_temp | round(1)) }}"
        dwell_ok: >
          {% set last_command = states('input_datetime.warehouse_cell_last_profile_command') %}
          {% if last_command in ['unknown', 'unavailable', 'none', ''] %}
            true
          {% else %}
            {% set last_command_ts = as_timestamp(last_command) %}
            {{ last_command_ts is none or (as_timestamp(now()) - last_command_ts) >= 7200 }}
          {% endif %}
        dwell_bypass: "{{ trigger.id in ['limit_change', 'manual_hold_released', 'startup'] }}"
        write_allowed: "{{ (dwell_ok | bool) or (dwell_bypass | bool) or (needs_profile_reapply | bool) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ (target_command != last_requested_command or (needs_profile_reapply | bool)) and (write_allowed | bool) }}"
          sequence:
            - action: nector200.apply_profile
              data:
                entity_id: sensor.wh1_temperature
                profile: "{{ target_profile | trim }}"
                min_temp: "{{ min_temp }}"
                max_temp: "{{ max_temp }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.warehouse_cell_last_requested_profile
              data:
                value: "{{ target_profile | trim }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.warehouse_cell_last_requested_command
              data:
                value: "{{ target_command }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.warehouse_cell_last_profile_command
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - conditions:
            - condition: template
              value_template: "{{ (target_command != last_requested_command or (needs_profile_reapply | bool)) and not (write_allowed | bool) }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: warehouse_cell_profile_guard
                title: "Warehouse cell profile held"
                message: >
                  Target {{ target_profile | trim }} skipped because profile dwell time has not elapsed.
  mode: single
- id: warehouse_cell_watchdog_monitor
  alias: Warehouse Cell NECTOR Watchdog Monitor
  description: >
    Temporary 72-hour watchdog for NECTOR profile, temperature, and output
    sanity while the new warehouse-cell guard logic settles in.
  triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: time_pattern
      minutes: "/15"
      id: periodic
    - trigger: state
      entity_id:
        - input_number.warehouse_cell_min_temperature
        - input_number.warehouse_cell_max_temperature
        - input_boolean.warehouse_cell_manual_hold
        - input_boolean.warehouse_cell_watchdog_enabled
        - input_datetime.warehouse_cell_watchdog_until
        - sensor.wh1_temperature
        - sensor.wh1_probe_s3_temperature
        - sensor.wh1_last_applied_profile
        - sensor.wh1_last_profile_error
        - binary_sensor.wh1_compressor
        - binary_sensor.wh1_fan
        - binary_sensor.wh1_hot_resistance
      id: state_change
  conditions:
    - condition: state
      entity_id: input_boolean.warehouse_cell_watchdog_enabled
      state: "on"
    - condition: template
      value_template: >
        {% set until_ts = as_timestamp(states('input_datetime.warehouse_cell_watchdog_until')) %}
        {{ until_ts is not none and as_timestamp(now()) <= until_ts }}
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger is defined and trigger.id == 'startup' }}"
      then:
        - delay: "00:02:00"
    - variables:
        issues: >
          {% set min_v = states('input_number.warehouse_cell_min_temperature') | float(none) %}
          {% set max_v = states('input_number.warehouse_cell_max_temperature') | float(none) %}
          {% set s1 = states('sensor.wh1_temperature') | float(none) %}
          {% set profile = states('sensor.wh1_last_applied_profile') | trim %}
          {% set profile_error = states('sensor.wh1_last_profile_error') | trim | lower %}
          {% set manual_hold = is_state('input_boolean.warehouse_cell_manual_hold', 'on') %}
          {% set compressor_on = is_state('binary_sensor.wh1_compressor', 'on') %}
          {% set heat_on = is_state('binary_sensor.wh1_hot_resistance', 'on') %}
          {% set ns = namespace(items=[]) %}
          {% if min_v is none or max_v is none or s1 is none %}
            {% set ns.items = ns.items + ['CRITICAL: S1 temperature or min/max helpers are unavailable.'] %}
          {% elif min_v >= max_v %}
            {% set ns.items = ns.items + ['CRITICAL: warehouse min temperature is not below max temperature.'] %}
          {% else %}
            {% if s1 > max_v + 1.5 %}
              {% set ns.items = ns.items + ['CRITICAL: S1 is ' ~ (s1 | round(1)) ~ ' C, above high guard ' ~ ((max_v + 1.5) | round(1)) ~ ' C.'] %}
            {% elif s1 > max_v + 0.8 %}
              {% set ns.items = ns.items + ['WARNING: S1 is ' ~ (s1 | round(1)) ~ ' C, above warning guard ' ~ ((max_v + 0.8) | round(1)) ~ ' C.'] %}
            {% endif %}
            {% if s1 < min_v - 0.5 %}
              {% set ns.items = ns.items + ['CRITICAL: S1 is ' ~ (s1 | round(1)) ~ ' C, below low guard ' ~ ((min_v - 0.5) | round(1)) ~ ' C.'] %}
            {% elif s1 < min_v - 0.3 %}
              {% set ns.items = ns.items + ['WARNING: S1 is ' ~ (s1 | round(1)) ~ ' C, below warning guard ' ~ ((min_v - 0.3) | round(1)) ~ ' C.'] %}
            {% endif %}
          {% endif %}
          {% if manual_hold %}
            {% set ns.items = ns.items + ['WARNING: manual hold is on, so NECTOR profile writes are disabled.'] %}
          {% elif profile not in ['cooling_guard', 'heating_guard'] %}
            {% set ns.items = ns.items + ['WARNING: active NECTOR profile is ' ~ profile ~ '.'] %}
          {% endif %}
          {% if profile_error not in ['', 'none', 'unknown', 'unavailable'] %}
            {% set ns.items = ns.items + ['WARNING: last NECTOR profile error is ' ~ profile_error ~ '.'] %}
          {% endif %}
          {% if compressor_on and heat_on %}
            {% set ns.items = ns.items + ['CRITICAL: compressor and hot resistance are both on.'] %}
          {% endif %}
          {{ ns.items | join('\n') }}
        status_level: >
          {% if 'CRITICAL:' in issues %}
            CRITICAL
          {% elif issues | trim != '' %}
            WARNING
          {% else %}
            OK
          {% endif %}
        status_summary: >
          {% set min_v = states('input_number.warehouse_cell_min_temperature') | float(none) %}
          {% set max_v = states('input_number.warehouse_cell_max_temperature') | float(none) %}
          {% set s1 = states('sensor.wh1_temperature') | float(none) %}
          {% set s3 = states('sensor.wh1_probe_s3_temperature') | float(none) %}
          {% set profile = states('sensor.wh1_last_applied_profile') | trim %}
          {{ now().strftime('%d %H:%M') }} {{ status_level | trim }} S1={{ (s1 | round(1)) if s1 is not none else '?' }} S3={{ (s3 | round(1)) if s3 is not none else '?' }} lim={{ (min_v | round(1)) if min_v is not none else '?' }}-{{ (max_v | round(1)) if max_v is not none else '?' }} prof={{ profile }} comp={{ states('binary_sensor.wh1_compressor') }} fan={{ states('binary_sensor.wh1_fan') }} heat={{ states('binary_sensor.wh1_hot_resistance') }}
        watchdog_message: >
          {{ issues | trim }}

          S1: {{ states('sensor.wh1_temperature') }} C
          S3: {{ states('sensor.wh1_probe_s3_temperature') }} C
          Limits: {{ states('input_number.warehouse_cell_min_temperature') }} C to {{ states('input_number.warehouse_cell_max_temperature') }} C
          Profile: {{ states('sensor.wh1_last_applied_profile') }}
          Last command: {{ states('input_text.warehouse_cell_last_requested_command') }}
          Last profile write: {{ states('sensor.wh1_last_profile_write') }}
          Outputs: compressor={{ states('binary_sensor.wh1_compressor') }}, fan={{ states('binary_sensor.wh1_fan') }}, heat={{ states('binary_sensor.wh1_hot_resistance') }}
          Watchdog active until: {{ states('input_datetime.warehouse_cell_watchdog_until') }}
    - action: input_text.set_value
      target:
        entity_id: input_text.warehouse_cell_watchdog_last_status
      data:
        value: "{{ status_summary[:255] }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ issues | trim != '' }}"
          sequence:
            - action: persistent_notification.create
              data:
                notification_id: warehouse_cell_watchdog
                title: "Warehouse cell watchdog {{ status_level | trim | lower }}"
                message: "{{ watchdog_message }}"
      default:
        - action: persistent_notification.dismiss
          data:
            notification_id: warehouse_cell_watchdog
  mode: restart
- id: warehouse_cell_watchdog_heartbeat
  alias: Warehouse Cell NECTOR Watchdog Heartbeat
  description: >
    Twice-daily heartbeat proving the temporary warehouse-cell watchdog is
    still active during the observation window.
  triggers:
    - trigger: time
      at:
        - "08:00:00"
        - "20:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.warehouse_cell_watchdog_enabled
      state: "on"
    - condition: template
      value_template: >
        {% set until_ts = as_timestamp(states('input_datetime.warehouse_cell_watchdog_until')) %}
        {{ until_ts is not none and as_timestamp(now()) <= until_ts }}
  actions:
    - action: persistent_notification.create
      data:
        notification_id: warehouse_cell_watchdog_heartbeat
        title: "Warehouse cell watchdog heartbeat"
        message: >
          Watchdog heartbeat at {{ now().strftime('%Y-%m-%d %H:%M') }}.

          S1: {{ states('sensor.wh1_temperature') }} C
          S3: {{ states('sensor.wh1_probe_s3_temperature') }} C
          Limits: {{ states('input_number.warehouse_cell_min_temperature') }} C to {{ states('input_number.warehouse_cell_max_temperature') }} C
          Profile: {{ states('sensor.wh1_last_applied_profile') }}
          Setpoint: {{ states('sensor.wh1_setpoint') }} C
          Outputs: compressor={{ states('binary_sensor.wh1_compressor') }}, fan={{ states('binary_sensor.wh1_fan') }}, heat={{ states('binary_sensor.wh1_hot_resistance') }}
          Watchdog active until: {{ states('input_datetime.warehouse_cell_watchdog_until') }}
  mode: single
- id: office_climate_schedule
  alias: Office Climate Schedule
  description: >
    Office workspaces (Dagmar, Tania, Projects 1, Reception):
    **comfort preset held 07:30–18:00** (target 25.5 °C), then **frost from
    18:00** (target 30 °C = no cooling, aligns with chiller hard-off at 18:00).
    Workdays only.

    2026-06-18 change (Dagmar): keep comfort until 18:00, do NOT drop to eco at
    17:00. Implemented by making the 17:00 eco slot re-apply comfort
    (eco_preset=comfort, a no-op keep) and moving frost_time 17:30 → 18:00.

    CS moved to own eco-by-default schedule 2026-05-26; Projects 2 moved BACK
    to common 2026-06-04 (P2 currently unoccupied, behaves as common space).
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_dagmar
      - climate.fancoil_tania
      - climate.projects_1
      - climate.fancoil_reception
      comfort_time: '08:00:00'
      eco_time: '17:00:00'
      frost_time: '18:00:00'
      enable_preheat: true
      preheat_time: '07:30:00'
      comfort_preset: comfort
      # eco slot re-applies comfort (keep comfort until 18:00, no 17:00 drop)
      eco_preset: comfort
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: common_climate_schedule
  alias: Common Spaces Climate Schedule (comfort-default @ 27)
  description: >
    Common open areas (OpenSpace, Entrance): COMFORT-default during work hours
    — target 27 °C (COMMON comfort_ac_temp). 2026-06-20 redesign reverses the
    earlier eco-by-default: common spaces now follow the same calendar as the
    occupied offices (comfort 08:00–18:00) but at their own 27 °C comfort.

    comfort 07:30–18:00 → **boil (frost @ 31) from 18:00** and all weekend.
    The 17:00 slot re-applies comfort (eco_preset=comfort) so comfort holds
    until 18:00. Manual override to eco possible if a space is unused.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_openspace
      - climate.fancoil_entrance
      comfort_time: '08:00:00'
      eco_time: '17:00:00'
      frost_time: '18:00:00'
      enable_preheat: true
      preheat_time: '07:30:00'
      comfort_preset: comfort
      # eco slot re-applies comfort → comfort held until 18:00 (no 17:00 drop)
      eco_preset: comfort
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: cs_climate_schedule
  alias: CS + Projects 2 Climate Schedule (eco-default, hold all day)
  description: >
    Customer Service and Projects 2: eco-default. The 08:00 "comfort" slot
    fires `eco`, and there is NO mid-day transition, so a manual override
    (comfort/boost) HOLDS until 18:00 — CS is usually occupied all day. At
    18:00 both evening slots resolve to **boil (frost @ 30)**, and the room
    stays in boil overnight + weekends.

    Projects 2 added here 2026-06-20 (eco-default, re-staffed). Note: P2's VT
    may still need a one-time Options-flow reconfigure to fully un-wedge.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_cs
      - climate.projects_2
      comfort_time: '08:00:00'
      # No 17:00 transition: both eco + frost slots fire at 18:00 → boil(frost),
      # so a manual comfort/boost holds until 18:00.
      eco_time: '18:00:00'
      frost_time: '18:00:00'
      enable_preheat: true
      preheat_time: '07:30:00'
      comfort_preset: eco
      eco_preset: none
      # 'frost' is NOT a selectable VT preset → boil is enforced as preset
      # 'none' + set_temperature(30/31) by offhours_boil_enforcer. This slot
      # just parks the room in neutral 'none'; the enforcer sets the boil target.
      frost_preset: none
- id: meeting_climate_schedule
  alias: Meeting Room Climate Schedule (eco-default, 1 h manual revert)
  description: >
    Meeting Room: eco-default. 08:00 sets eco; no mid-day transition. When the
    room is used, manually set comfort/boost — the separate
    `meeting_manual_revert` automation returns it to eco 1 hour later. At 18:00
    → **boil (frost @ 30)**, held overnight + weekends.
  use_blueprint:
