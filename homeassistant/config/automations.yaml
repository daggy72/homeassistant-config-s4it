- id: meeting_room_boost
  alias: Meeting Room Boost (12-14)
  description: >
    Boost meeting room to 22°C between 12:00-14:00 on workdays,
    then return to comfort preset.
  triggers:
  - trigger: time
    at: '12:00:00'
    id: boost_start
  - trigger: time
    at: '14:00:00'
    id: boost_end
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: boost_start
      sequence:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.fancoil_meeting
        data:
          preset_mode: boost
    - conditions:
      - condition: trigger
        id: boost_end
      sequence:
      - action: climate.set_preset_mode
        target:
          entity_id: climate.fancoil_meeting
        data:
          preset_mode: comfort
  mode: single
- id: cs_sun_shade
  alias: CS Sun Shade (Morning)
  description: >
    Lower CS shade to 30% when sunny during the ESE sun window (08:00-11:00).
    Triggers at 08:00 and also when clouds clear during the window.
    Raises at 11:00 when sun moves past, or if clouds roll in.
  mode: single
  triggers:
  - trigger: time
    at: '08:00:00'
    id: sun_check
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    below: 50
    id: sun_check
  - trigger: time
    at: '11:00:00'
    id: sun_past
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    above: 70
    id: cloudy
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sun_check
      - condition: time
        after: '08:00:00'
        before: '11:00:00'
      - condition: numeric_state
        entity_id: weather.forecast_home
        attribute: cloud_coverage
        below: 50
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: numeric_state
        entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        attribute: current_position
        above: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        data:
          position: 30
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: sun_past
        - condition: trigger
          id: cloudy
      - condition: numeric_state
        entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        attribute: current_position
        below: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        data:
          position: 100
- id: mensa_sun_shade
  alias: Mensa Sun Shade (Afternoon)
  description: >
    Lower Mensa shade to 30% when sun is in SSW range (170-240°) on sunny days.
    Also triggers when clouds clear during the SSW window.
    Raises when sun exits 240°, at 17:00, or if clouds roll in.
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 170
    id: sun_check
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    below: 50
    id: sun_check
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 240
    id: sun_exits_ssw
  - trigger: time
    at: '17:00:00'
    id: end_of_day
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    above: 70
    id: cloudy
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sun_check
      - condition: numeric_state
        entity_id: sun.sun
        attribute: azimuth
        above: 170
      - condition: numeric_state
        entity_id: sun.sun
        attribute: azimuth
        below: 240
      - condition: numeric_state
        entity_id: weather.forecast_home
        attribute: cloud_coverage
        below: 50
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 15
      - condition: numeric_state
        entity_id: cover.shellypro2cover_2cbcbbb1ff9c_cover_0
        attribute: current_position
        above: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_2cbcbbb1ff9c_cover_0
        data:
          position: 30
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: sun_exits_ssw
        - condition: trigger
          id: end_of_day
        - condition: trigger
          id: cloudy
      - condition: numeric_state
        entity_id: cover.shellypro2cover_2cbcbbb1ff9c_cover_0
        attribute: current_position
        below: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_2cbcbbb1ff9c_cover_0
        data:
          position: 100
