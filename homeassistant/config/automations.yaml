      predictive_close_dt: input_datetime.mensa_predictive_close_at
      reactive_close_dt: input_datetime.mensa_reactive_close_at
      forecast_snapshot: input_number.mensa_forecast_max_at_window_start
      sun_azimuth_min: 170
