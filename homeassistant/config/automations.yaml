- id: meeting_climate_schedule
  alias: Meeting Room Climate Schedule
  description: >
    Meeting Room: eco preset all day by default. Lunch is no longer taken
    in the meeting room (moved to Mensa 2026-05), so there's no scheduled
    boost. When the room IS used for a meeting, manually set its preset
    to `comfort` or `boost` via the dashboard — auto-revert (60 min for
    boost) catches it. Frost preset overnight as usual.
  use_blueprint:
    path: custom/office_climate_schedule.yaml
    input:
      thermostats:
      - climate.fancoil_meeting
      comfort_time: '08:00:00'
      eco_time: '17:00:00'
      frost_time: '19:00:00'
      # eco-by-default: the "comfort" slot fires the eco preset instead of comfort,
      # so the room stays in eco from 08:00 through 17:00 unless manually overridden.
      comfort_preset: eco
      eco_preset: eco
      frost_preset: frost
- id: boost_auto_revert
  alias: Boost Auto-Revert
  description: >
    When a user sets any VT to boost via the dashboard thermostat card,
    this automation converts it to a 60-minute timed preset and monitors
    for target temperature reached. Reverts to scheduled preset on
    whichever comes first: temp reached or 60 minutes elapsed.
  mode: parallel
  max: 9
  triggers:
  - trigger: state
    entity_id:
    - climate.fancoil_dagmar
    - climate.fancoil_tania
    - climate.projects_1
    - climate.fancoil_cs
    - climate.fancoil_reception
    - climate.fancoil_meeting
    - climate.fancoil_openspace
    - climate.fancoil_entrance
    - climate.climate_mensa
    - climate.projects_2
    attribute: preset_mode
    to: boost
  actions:
  - variables:
      vt: "{{ trigger.entity_id }}"
  - action: versatile_thermostat.set_timed_preset
    target:
      entity_id: "{{ vt }}"
    data:
      preset: boost
      duration_minutes: 60
  - repeat:
      while:
      - condition: template
        value_template: >
          {{ state_attr(vt, 'preset_mode') == 'boost' }}
      sequence:
      - delay:
          seconds: 30
      - condition: template
        value_template: >
          {% set current = state_attr(vt, 'current_temperature') | float(0) %}
          {% set target = state_attr(vt, 'temperature') | float(0) %}
          {% set mode = states(vt) %}
          {% if mode == 'heat' %}
            {{ current >= target }}
          {% elif mode == 'cool' %}
            {{ current <= target }}
          {% else %}
            true
          {% endif %}
      - action: versatile_thermostat.cancel_timed_preset
        target:
          entity_id: "{{ vt }}"
- id: cs_sun_shade
  alias: CS Sun Shade (Morning)
  description: >
    Lower CS shade to 30% when sunny during the ESE sun window (08:00-11:00).
    Triggers at 08:00 and also when clouds clear during the window.
    Raises at 11:00 when sun moves past, or if clouds roll in.
  mode: single
  triggers:
  - trigger: time
    at: '08:00:00'
    id: sun_check
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    below: 50
    id: sun_check
  - trigger: time
    at: '11:00:00'
    id: sun_past
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: cloud_coverage
    above: 70
    id: cloudy
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sun_check
      - condition: time
        after: '08:00:00'
        before: '11:00:00'
      - condition: numeric_state
        entity_id: weather.forecast_home
        attribute: cloud_coverage
        below: 50
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: numeric_state
        entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        attribute: current_position
        above: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        data:
          position: 30
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: sun_past
        - condition: trigger
          id: cloudy
      - condition: numeric_state
        entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        attribute: current_position
        below: 50
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.shellypro2cover_34987a47c9b0_cover_1
        data:
          position: 100

- id: sun_shade_forecast_populator
  alias: Sun Shade — Populate today's outdoor max forecast
  description: >
    Calls weather.get_forecasts (the modern replacement for the deprecated
    forecast attribute) and writes today's max temperature into
    input_number.shade_today_outdoor_max_forecast so the blueprint can
    read it from a simple numeric_state condition.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "06:00:00"
    - trigger: time_pattern
      minutes: 5
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_response
    - variables:
        today_max: >
          {% set fc = forecast_response['weather.forecast_home'].forecast %}
          {% if fc and fc | length > 0 %}
            {{ fc[0].temperature | float(0) }}
          {% else %}
            0
          {% endif %}
    - action: input_number.set_value
      target:
        entity_id: input_number.shade_today_outdoor_max_forecast
      data:
        value: "{{ today_max }}"

- id: sun_shade_midnight_reset
  alias: Sun Shade — Midnight counter reset
  description: >
    Resets per-room manual-override counters at 00:00:01 so the nightly
    evaluator (which runs at 21:00 UTC, before local midnight) sees the
    full day's counts, and the next day starts fresh.
  mode: single
  triggers:
    - trigger: time
      at: "00:00:01"
  actions:
    - action: counter.reset
      target:
        entity_id:
          - counter.meeting_room_manual_override_count
          - counter.mensa_manual_override_count

- id: sun_shade_meeting_room
  alias: Sun Shade — Meeting Room
  description: Intelligent sun shade for the Meeting Room (ESE, azimuth 90–150°)
  use_blueprint:
    path: custom/intelligent_sun_shade.yaml
    input:
      cover_entity: cover.shellypro2cover_34987a47c9b0_cover_0
      room_climate_entity: climate.fancoil_meeting
      rate_sensor_entity: sensor.meeting_room_temp_rate
      manual_grace_timer: timer.shade_meeting_manual_grace
      manual_override_counter: counter.meeting_room_manual_override_count
