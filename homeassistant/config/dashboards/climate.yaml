# =============================================================================
# Climate Control Dashboard — YAML managed
# =============================================================================

views:
  - title: Climate Control
    path: climate
    icon: mdi:thermostat
    cards:

      # --- System Status (read-only; Season + Chiller moved to Admin view) ---
      - type: entities
        title: System
        entities:
          - entity: sensor.outdoor_temperature
            name: Outdoor Temperature

      # --- Warehouse Cell (PEGO) — monitoring only; limits/watchdog settings moved to Admin view ---
      - type: entities
        title: Warehouse Cell
        state_color: true
        entities:
          - type: section
            label: Temperature
          - entity: sensor.wh1_temperature
            name: S1 ambient
          - entity: sensor.wh1_probe_s3_temperature
            name: S3 probe
          - entity: sensor.wh1_setpoint
            name: NECTOR setpoint
          - type: section
            label: Profile
          - entity: sensor.wh1_last_applied_profile
            name: Last applied profile
          - entity: sensor.wh1_last_profile_write
            name: Last profile write
          - entity: sensor.wh1_last_profile_error
            name: Last profile error
          - type: section
            label: Outputs
          - entity: binary_sensor.wh1_compressor
            name: Compressor
          - entity: binary_sensor.wh1_defrost_output
            name: Defrost
          - entity: binary_sensor.wh1_fan
            name: Fan
          - entity: binary_sensor.wh1_alarm_relay
            name: Alarm relay
          - entity: binary_sensor.wh1_auxiliary_relay
            name: Auxiliary relay
          - entity: binary_sensor.wh1_hot_resistance
            name: Hot resistance

      # --- Office Zones ---
      - type: grid
        columns: 2
        cards:
          - type: thermostat
            entity: climate.fancoil_dagmar
            name: Dagmar
          - type: thermostat
            entity: climate.fancoil_tania
            name: Tania
          - type: thermostat
            entity: climate.projects_1
            name: Projects 1
          - type: thermostat
            entity: climate.fancoil_cs
            name: Customer Service
          - type: thermostat
            entity: climate.fancoil_reception
            name: Reception

      # --- Common Zones ---
      - type: grid
        columns: 2
        cards:
          - type: thermostat
            entity: climate.fancoil_meeting
            name: Meeting Room
          - type: thermostat
            entity: climate.fancoil_openspace
            name: Open Space
          - type: thermostat
            entity: climate.fancoil_entrance
            name: Entrance
          - type: thermostat
            entity: climate.climate_mensa
            name: Mensa

      # --- Fancoil Demand (valve %) ---
      - type: entities
        title: Fancoil Demand
        entities:
          - entity: number.fancoil_dagmar
            name: Dagmar
          - entity: number.fancoil_tania
            name: Tania
          - entity: number.fancoil_projects_1
            name: Projects 1
          - entity: number.fancoil_cs
            name: CS
          - entity: number.fancoil_reception
            name: Reception
          - entity: number.fancoil_meeting
            name: Meeting
          - entity: number.fancoil_openspace
            name: OpenSpace
          - entity: number.fancoil_entrance
            name: Entrance
          - entity: number.fancoil_mensa_1
            name: Mensa

      # --- Shades ---
      - type: entities
        title: Window Shades
        entities:
          - entity: cover.shellypro2cover_34987a47c9b0_cover_1
            name: Tenda CS
          - entity: cover.shellypro2cover_34987a47c9b0_cover_0
            name: Tenda Meeting
          - entity: cover.shellypro2cover_2cbcbbb1ff9c_cover_0
            name: Tende Mensa

      - type: entities
        title: Sun Shade — Thresholds & Activity
        state_color: true
        entities:
          - type: section
            label: Global thresholds
          - entity: input_number.shade_forecast_max_threshold
            name: Forecast trigger
          - entity: input_number.shade_clouds_close_threshold
            name: Clouds (close)
          - entity: input_number.shade_clouds_open_threshold
            name: Clouds (open)
          - entity: input_number.shade_room_cap
            name: Room cap
          - entity: input_number.shade_rate_threshold
            name: Rate of rise
          - entity: input_number.shade_room_reopen
            name: Room re-open
          - entity: input_number.shade_closed_position
            name: Closed position
          - entity: input_number.shade_open_position
            name: Open position
          - entity: input_number.shade_grace_minutes
            name: Grace (minutes)
          - type: section
            label: Today
          - entity: input_number.shade_today_outdoor_max_forecast
            name: Forecast max today
          - entity: input_number.meeting_room_forecast_max_at_window_start
            name: Meeting — forecast at window start
          - entity: input_number.mensa_forecast_max_at_window_start
            name: Mensa — forecast at window start
          - type: section
            label: Manual overrides (today)
          - entity: counter.meeting_room_manual_override_count
            name: Meeting
          - entity: counter.mensa_manual_override_count
            name: Mensa
          - type: section
            label: Last close events
          - entity: input_datetime.meeting_room_predictive_close_at
            name: Meeting — predictive
          - entity: input_datetime.meeting_room_reactive_close_at
            name: Meeting — reactive
          - entity: input_datetime.mensa_predictive_close_at
            name: Mensa — predictive
          - entity: input_datetime.mensa_reactive_close_at
            name: Mensa — reactive
          - type: section
            label: Grace timers
          - entity: timer.shade_meeting_manual_grace
            name: Meeting
          - entity: timer.shade_mensa_manual_grace
            name: Mensa

      # --- Summer Dynamic Temps (only visible in summer) ---
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.climate_season
            state: summer
        card:
          type: entities
          title: Summer Cooling Targets
          entities:
            - entity: sensor.summer_comfort_office
              name: Office Comfort Target
            - entity: sensor.summer_comfort_common
              name: Common Comfort Target
            - entity: sensor.summer_eco_office
              name: Office Eco Target
            - entity: sensor.summer_eco_common
              name: Common Eco Target

  # =============================================================================
  # Admin — Season override + Chiller. Restricted: an accidental tap here stops
  # heat/cool for the whole building (2026-07-29: Roberta hit "Off" and every
  # VT + the chiller stopped until manually switched back on).
  # =============================================================================
  - title: Climate — Admin
    path: climate-admin
    icon: mdi:shield-lock
    visible:
      - user: 7366d89540354749b99668d6c285f270  # Dagmar -local admin- Sporck
      - user: 68599956f906423390a62bc47a34bfaa  # Dagmar Sporck
    cards:

      # --- Season Selector ---
      - type: horizontal-stack
        cards:
          - type: button
            name: Winter
            icon: mdi:snowflake-thermometer
            icon_height: 40px
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                option: winter
              target:
                entity_id: input_select.climate_season
            show_state: false
          - type: button
            name: "Off"
            icon: mdi:power-standby
            icon_height: 40px
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                option: "off"
              target:
                entity_id: input_select.climate_season
            show_state: false
          - type: button
            name: Summer
            icon: mdi:sun-thermometer
            icon_height: 40px
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                option: summer
              target:
                entity_id: input_select.climate_season
            show_state: false

      # --- System Status ---
      - type: entities
        title: System
        entities:
          - entity: input_select.climate_season
            name: Active Season
          - entity: switch.shellypro4pm_ece334eaf568_switch_2
            name: Chiller
          - entity: sensor.outdoor_temperature
            name: Outdoor Temperature

      # --- Warehouse Cell (PEGO) — settings only; monitoring stays on the public view ---
      - type: entities
        title: Warehouse Cell Settings
        state_color: true
        entities:
          - type: section
            label: Limits
          - entity: input_number.warehouse_cell_min_temperature
            name: Minimum
          - entity: input_number.warehouse_cell_max_temperature
            name: Maximum
          - entity: input_boolean.warehouse_cell_manual_hold
            name: Manual hold
          - type: section
            label: Watchdog
          - entity: input_boolean.warehouse_cell_watchdog_enabled
            name: Enabled
          - entity: input_datetime.warehouse_cell_watchdog_until
            name: Active until
          - entity: input_text.warehouse_cell_watchdog_last_status
            name: Last status
          - entity: input_text.warehouse_cell_last_requested_command
            name: Last requested command
