services:
  homeassistant:
    container_name: HA_homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/homeassistant/config:/config
      - /usr/syno/etc/certificate/system/default:/ssl:ro
      - ${BACKUP_PATH:-/volume1/backup/homeassistant}:/backup
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/homeassistant/data:/data
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  influxdb:
    container_name: HA_influxdb
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-sales4it}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-ha_longterm}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0}
    volumes:
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/influxdb2/data:/var/lib/influxdb2
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/influxdb2/config:/etc/influxdb2
      - ./influxdb/tasks:/opt/influxdb/tasks:ro

  grafana-internal:
    container_name: HA_grafana_internal
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-sales4it}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-ha_longterm}
      INFLUXDB_GRAFANA_READ_TOKEN: ${INFLUXDB_GRAFANA_READ_TOKEN:-}
    volumes:
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/grafana/internal-data:/var/lib/grafana
      - ./grafana/internal/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/internal/dashboards:/var/lib/grafana/dashboards:ro

  grafana-wh1:
    container_name: HA_grafana_wh1
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "127.0.0.1:13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_WH1_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_WH1_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-sales4it}
      INFLUXDB_CUSTOMER_BUCKET: ${INFLUXDB_CUSTOMER_BUCKET:-wh1_customer}
      INFLUXDB_WH1_READ_TOKEN: ${INFLUXDB_WH1_READ_TOKEN:-}
    volumes:
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/grafana/wh1-data:/var/lib/grafana
      - ./grafana/customer/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/customer/dashboards:/var/lib/grafana/dashboards:ro

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: HA_matter-server
    restart: unless-stopped
    network_mode: host
    privileged: true
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/homeassistant/matter-data:/data
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    # map BLE only if you really need it:
    # devices:
    #   - /dev/hci0:/dev/hci0
    command: >
      --storage-path /data
      --paa-root-cert-dir /data/credentials
      --primary-interface eth1
      --bluetooth-adapter 0

  esphome:
    container_name: HA_esphome
    image: ghcr.io/esphome/esphome:stable
    volumes:
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/esphome/config:/config
      - ${DOCKER_BASE:-/volume1/docker/homeassistant}/esphome/data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
